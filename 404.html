<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audrey Care</title>
<script>
// GitHub Pages serves this file for any address it has no page for. A scanned vessel sticker opens /batch/<id> (or /vessel/<id>);
// send it to the app, which shows that batch (after sign-in). Anything else gets a short "not found" message with a link home.
(function(){
  var m = location.pathname.match(/^\/(?:batch|vessel)\/([^\/]+)\/?$/i);
  if(m){
    var extra = location.search ? '&' + location.search.slice(1) : '';
    location.replace('/?batch=' + m[1] + extra);
  }
})();
</script>

  a{color:#3C9058;font-weight:600;}

  </div>
