function renderOrdersProcessPage(){
  const counts = STAGES.map((_,i)=>activeOrders().filter(o=>o.stage===i).length);
  const total = activeOrders().length;
  const maxCount = Math.max(1, ...counts);

  function nameList(list){
    if(list.length===0) return `<div class="empty-state" style="padding:20px;">Nothing here right now.</div>`;
    return `<div style="display:flex;flex-direction:column;">
      ${list.map(o=>`
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 18px;border-bottom:1px solid var(--border);">
          <div>
            <div style="font-weight:600;font-size:13.5px;">${esc(o.customer)}</div>
            <div class="hint">${esc(o.orderNumber||o.id)}${o.product?(' · '+richText(o.product)):''}</div>
          </div>
          <div class="hint">${daysAgo(o.createdAt)} ago</div>
        </div>`).join('')}
    </div>`;
  }

  return `
  <div class="panel">
    <div class="panel-head">
      <h3>Orders board progress</h3>
      <button type="button" class="btn btn-sm" id="btn-copy-board-link">Copy public board link</button>
    </div>
    <div class="panel-body">
      ${total===0 ? emptyChart('No order data available') : `
      <div style="display:flex;flex-direction:column;gap:10px;">
        ${STAGES.map((s,i)=>{
          const key = STAGE_KEYS[i]; const style = STAGE_STYLE[key];
          const pct = Math.round((counts[i]/maxCount)*100);
          return `
          <div>
            <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;">
              <span>${s}</span><span class="hint">${counts[i]}</span>
            </div>
            <div style="height:8px;border-radius:99px;background:${style.bg};overflow:hidden;">
              <div style="height:100%;width:${pct}%;background:${style.c};border-radius:99px;"></div>
            </div>
          </div>`;
        }).join('')}
      </div>`}
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;">
    ${STAGES.map((s,i)=>{
      const list = activeOrders().filter(o=>o.stage===i).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
      return `
      <div class="panel" style="margin-bottom:0;">
        <div class="panel-head"><h3>${esc(s)} <span class="hint">(${list.length})</span></h3></div>
        <div class="panel-body" style="padding:0;">${nameList(list)}</div>
      </div>`;
    }).join('')}
  </div>
  `;
}

/* ===================== GMP page (document attachments) ===================== */
function renderGmpPage(){
  return renderGmpChecklistsSection();
}
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function renderGmpChecklistsSection(){
  const defs = GMP_CHECKLIST_DEFS;
  let checklistId = state.filters.gmpChecklistId;
  if(!checklistId || !gmpChecklistDefById(checklistId)) checklistId = defs[0].id;
  const def = gmpChecklistDefById(checklistId);
  const view = state.filters.gmpChecklistView === 'calendar' ? 'calendar' : 'grid';

  const now = new Date();
  let period = state.filters.gmpChecklistPeriod;
  let year, month;
  if(period && /^\d{4}-\d{1,2}$/.test(period)){
    [year, month] = period.split('-').map(Number);
  } else {
    year = now.getFullYear(); month = now.getMonth()+1;
  }
  const daysInMonth = new Date(year, month, 0).getDate();
  const days = Array.from({length:daysInMonth}, (_,i)=>i+1);
  const entry = gmpChecklistEntryFor(checklistId, year, month);
  const cells = entry ? entry.cells : {};
  const extraRows = gmpChecklistExtraRows(def);

  return `
  <div class="stat-grid">
    <div class="stat-card"><div class="label">Checklists</div><div class="value">${defs.length}</div></div>
    <div class="stat-card"><div class="label">Tasks tracked</div><div class="value">${def.tasks.length}</div></div>
    <div class="stat-card"><div class="label">Viewing</div><div class="value" style="font-size:16px;">${MONTH_NAMES[month-1]} ${year}</div></div>
  </div>
  <div class="toolbar" style="flex-wrap:wrap;">
    <div class="tabs" style="flex-wrap:wrap;">
      ${defs.map(d=>`<button class="tab ${checklistId===d.id?'active':''}" data-checklist-select="${d.id}">${esc(d.name)}</button>`).join('')}
      <button type="button" class="tab ${view==='calendar'?'':'active'}" data-checklist-view-mode="grid" style="margin-left:6px;">Grid</button>
      <button type="button" class="tab ${view==='calendar'?'active':''}" data-checklist-view-mode="calendar">📅 Datewise</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <button type="button" class="btn btn-sm" id="btn-checklist-prev-month">‹ Prev</button>
      <div style="font-weight:600;font-size:13px;min-width:130px;text-align:center;">${MONTH_NAMES[month-1]} ${year}</div>
      <button type="button" class="btn btn-sm" id="btn-checklist-next-month">Next ›</button>
    </div>
  </div>
  <div class="panel" style="margin-bottom:14px;">
    <div style="display:flex;flex-wrap:wrap;gap:24px;font-size:13px;">
      <div><span class="hint">Area</span><br><strong>${esc(def.area)}</strong></div>
      <div><span class="hint">Responsibility</span><br><strong>${esc(def.responsibility)}</strong></div>
      <div><span class="hint">Accountability</span><br><strong>${esc(def.accountability)}</strong></div>
    </div>
    ${view==='calendar'
      ? `<div class="hint" style="margin-top:10px;">Click a date to open that day's checklist — plenty of room to see every task and sign off.</div>`
      : `<div class="hint" style="margin-top:10px;">Click a day cell to cycle its status: blank → <strong style="color:${GMP_CHECKLIST_STATUS_COLOR.OK};">OK</strong> → <strong style="color:${GMP_CHECKLIST_STATUS_COLOR.NOTOK};">Not OK</strong> → <strong style="color:${GMP_CHECKLIST_STATUS_COLOR.REDO};">Re-Do</strong> → blank. Changes save automatically.</div>`}
  </div>
  ${view==='calendar' ? renderChecklistCalendar(checklistId, year, month, def, entry) : `
  <div class="checklist-scroll">
    <table class="checklist-grid">
      <thead>
        <tr>
          <th class="checklist-task-col">Task</th>
          ${days.map(d=>`<th>${d}</th>`).join('')}
        </tr>
      </thead>
      <tbody>
        ${def.tasks.map(t=>`
        <tr>
          <td class="checklist-task-col">${esc(t.code)}. ${esc(t.label)} <span class="hint">(${esc(t.freq)})</span></td>
          ${days.map(d=>{
            const v = cells[t.code+'_'+d] || '';
            const color = v ? GMP_CHECKLIST_STATUS_COLOR[v] : 'transparent';
            const textColor = v ? '#fff' : 'var(--ink)';
            return `<td class="checklist-cell" style="background:${color};color:${textColor};" data-checklist-cell data-task="${t.code}" data-day="${d}">${v ? (v==='OK'?'OK':v==='NOTOK'?'X':'R') : ''}</td>`;
          }).join('')}
        </tr>`).join('')}
        ${extraRows.map(r=>{
          const vals = entry && entry[r.key] ? entry[r.key] : {};
          if(r.type==='signature'){
            return `<tr>
              <td class="checklist-task-col">${esc(r.label)}</td>
              ${days.map(d=>{
                const sig = vals[d];
                return `<td><button type="button" class="checklist-sign-btn" data-checklist-sign="${checklistId}|${year}|${month}|${d}|${r.key}">${sig && sig.dataUrl
                  ? `<span class="checklist-sign-thumb"><img src="${sig.dataUrl}" alt=""><span class="checklist-sign-name">${esc(sig.name||'')}</span></span>`
                  : `<span class="checklist-sign-placeholder">✎ Sign</span>`}</button></td>`;
              }).join('')}
            </tr>`;
          }
          return `<tr>
            <td class="checklist-task-col">${esc(r.label)}</td>
            ${days.map(d=>`<td><input type="text" class="checklist-signoff-input" data-signoff="${r.key}" data-day="${d}" value="${esc(vals[d]||'')}"></td>`).join('')}
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>
  `}
  ${entry ? `<div class="hint" style="margin-top:8px;">Last updated ${fmtDateTime(entry.updatedAt)}</div>` : ''}
  `;
}
function renderChecklistCalendar(checklistId, year, month, def, entry){
  const daysInMonth = new Date(year, month, 0).getDate();
  const firstWeekday = new Date(year, month-1, 1).getDay();
  const cells = entry ? entry.cells : {};
  const signatureRows = gmpChecklistExtraRows(def).filter(r=>r.type==='signature');
  const weekdayLabels = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const totalTasks = def.tasks.length;
  let dayCellsHtml = '';
  for(let i=0;i<firstWeekday;i++) dayCellsHtml += `<div class="cal-day cal-day-empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    let setCount=0, notOkCount=0, redoCount=0;
    def.tasks.forEach(t=>{
      const v = cells[t.code+'_'+d];
      if(v){ setCount++; if(v==='NOTOK') notOkCount++; else if(v==='REDO') redoCount++; }
    });
    const signed = signatureRows.length>0 && signatureRows.every(r=>entry && entry[r.key] && entry[r.key][d] && entry[r.key][d].dataUrl);
    let dotColor = null;
    if(setCount>0){
      if(notOkCount>0) dotColor = GMP_CHECKLIST_STATUS_COLOR.NOTOK;
      else if(redoCount>0) dotColor = GMP_CHECKLIST_STATUS_COLOR.REDO;
      else if(setCount===totalTasks) dotColor = GMP_CHECKLIST_STATUS_COLOR.OK;
      else dotColor = '#c9a227';
    }
    dayCellsHtml += `
    <button type="button" class="cal-day" data-checklist-day="${checklistId}|${year}|${month}|${d}">
      <span class="cal-day-num">${d}</span>
      ${dotColor ? `<span class="cal-day-dot" style="background:${dotColor};"></span>` : ''}
      ${signed ? `<span class="cal-day-signed" title="Signed off">✓</span>` : ''}
    </button>`;
  }
  return `
  <div class="cal-weekdays">${weekdayLabels.map(w=>`<div>${w}</div>`).join('')}</div>
  <div class="cal-grid">${dayCellsHtml}</div>
  `;
}
function checklistDayModal(paramStr){
  const [checklistId, yearStr, monthStr, dayStr] = paramStr.split('|');
  const year = Number(yearStr), month = Number(monthStr), day = Number(dayStr);
  const def = gmpChecklistDefById(checklistId);
  if(!def) return '';
  const entry = gmpChecklistEntryFor(checklistId, year, month);
  const cells = entry ? entry.cells : {};
  const extraRows = gmpChecklistExtraRows(def);
  return `
  <div class="overlay" id="overlay">
    <div class="modal" style="max-width:520px;">
      <h2 style="margin-bottom:2px;">${esc(def.name)}</h2>
      <div class="hint" style="margin-bottom:14px;">${MONTH_NAMES[month-1]} ${day}, ${year}</div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;">
        ${def.tasks.map(t=>{
          const v = cells[t.code+'_'+day] || '';
          const color = v ? GMP_CHECKLIST_STATUS_COLOR[v] : 'var(--bg)';
          const textColor = v ? '#fff' : 'var(--muted)';
          const label = v ? (v==='OK'?'OK':v==='NOTOK'?'Not OK':'Re-Do') : 'Not set';
          return `<button type="button" class="day-task-row" data-checklist-day-cell data-checklist="${esc(checklistId)}" data-year="${year}" data-month="${month}" data-day="${day}" data-task="${t.code}">

// Standard concatenated-SMS character math: how many characters are left in the current
// segment, and how many 160-char segments the message will take up.
function smsCharInfo(len){
  const segs = len===0 ? 1 : Math.ceil(len/160);
  const remaining = (segs*160) - len;
  return {segs, remaining};
}

  </div>`;
}

function renderRatingsPage(){
  const admin = isAdmin();
  const rated = state.orders.filter(o=>o.customerRating).slice().sort((a,b)=>new Date(b.customerRatingAt||0)-new Date(a.customerRatingAt||0));
  const avg = rated.length ? (rated.reduce((sum,o)=>sum+o.customerRating,0)/rated.length) : 0;
  const allSelected = rated.length>0 && rated.every(o=>state.selectedRatings.has(o.id));
  return `
  <div class="stat-grid">
    <div class="stat-card"><div class="label">Ratings received</div><div class="value">${rated.length}</div></div>
    <div class="stat-card"><div class="label">Average rating</div><div class="value accent">${rated.length?avg.toFixed(1)+' ★':'—'}</div></div>
  </div>
  ${admin && state.selectedRatings.size>0 ? `
  <div class="toolbar">
    <span class="hint">${state.selectedRatings.size} selected</span>

  </div>` : ''}
  <div class="panel">
    ${rated.length===0 ? `<div class="empty-state">No ratings yet — they'll show up here once customers rate their delivery on the track order page.</div>` : `
    <table class="data-table">
      <thead><tr>

    </table>`}
  </div>
  `;

/* ===================== Recipes & batch timer ===================== */
function formatCountdown(totalSeconds){
  const s = Math.max(0, Math.round(totalSeconds));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  const pad = n => String(n).padStart(2,'0');
  return h>0 ? `${h}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
}
/* ===================== Batch alert sound ===================== */
let _batchAudioCtx = null;
function ensureBatchAudioCtx(){
  if(!_batchAudioCtx){
    try{ _batchAudioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ return null; }
  }
  if(_batchAudioCtx.state==='suspended'){ _batchAudioCtx.resume().catch(()=>{}); }
  return _batchAudioCtx;
}
const ALERT_SOUNDS = {
  chime:  { name:'Chime',       notes:[{f:880,   t:'sine'},{f:1108.7,t:'sine'},{f:1318.5,t:'sine'}],           gap:0.16, dur:0.55, gain:0.3  },
  bell:   { name:'Bell',        notes:[{f:659.3, t:'sine'},{f:987.8, t:'sine'}],                                gap:0.05, dur:1.1,  gain:0.28 },
  beep:   { name:'Beep beep',   notes:[{f:1000,  t:'square'},{f:1000,t:'square'},{f:1000, t:'square'}],         gap:0.22, dur:0.14, gain:0.2  },
  alarm:  { name:'Alarm',       notes:[{f:740,   t:'sawtooth'},{f:1040,t:'sawtooth'},{f:740,t:'sawtooth'},{f:1040,t:'sawtooth'}], gap:0.18, dur:0.2, gain:0.22 },
  digital:{ name:'Digital blip',notes:[{f:1200,  t:'triangle'},{f:1500,t:'triangle'},{f:1800,t:'triangle'}],    gap:0.09, dur:0.12, gain:0.24 },
  ding:   { name:'Soft ding',   notes:[{f:987.8, t:'sine'}],                                                    gap:0,    dur:0.9,  gain:0.3  }
};
function currentAlertSound(){
  const id = state.branding && state.branding.alertSound;
  return ALERT_SOUNDS[id] ? id : 'chime';
}
function currentAlertDurationSeconds(){
  const v = state.branding && Number(state.branding.alertDurationSeconds);
  return (v && v>0) ? v : 5;
}
let _alertAudioEl = null;
let _alertSynthTimer = null;
// Stops whatever alert is currently sounding — a real <audio> file or a repeating synth
// cycle — so a new alert (or a second Preview click) never overlaps a previous one.
function stopAlertSound(){
  if(_alertAudioEl){ try{ _alertAudioEl.pause(); _alertAudioEl.currentTime = 0; }catch(e){} _alertAudioEl = null; }
  if(_alertSynthTimer){ clearInterval(_alertSynthTimer); _alertSynthTimer = null; }
}
function playAlertSoundById(id, durationSeconds){
  stopAlertSound();
  const preset = ALERT_SOUNDS[id] || ALERT_SOUNDS.chime;
  const duration = durationSeconds!=null ? durationSeconds : currentAlertDurationSeconds();
  if(preset.type==='audio'){
    try{
      const audioEl = new Audio(preset.src);
      audioEl.loop = true;
      _alertAudioEl = audioEl;
      audioEl.play().catch(()=>{});
      setTimeout(()=>{ if(_alertAudioEl===audioEl) stopAlertSound(); }, duration*1000);
    }catch(e){ /* best-effort — never let a sound glitch break the timer */ }
    return;
  }
  // Synthesized tones are sub-second, so repeat the note sequence back-to-back until the
  // configured duration has elapsed (matches how the real audio files sustain via loop above).
  const playOnce = () => {
    const ctx = ensureBatchAudioCtx();
    if(!ctx) return;
    try{
      const now = ctx.currentTime;
      preset.notes.forEach((n,i)=>{
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = n.t;
        osc.frequency.value = n.f;
        const start = now + i*preset.gap;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(preset.gain, start+0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, start+preset.dur);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(start); osc.stop(start+preset.dur+0.05);
      });
    }catch(e){ /* best-effort */ }
  };
  const cycleMs = Math.max(200, (preset.notes.length*preset.gap + preset.dur) * 1000);
  playOnce();
  let elapsedMs = 0;
  _alertSynthTimer = setInterval(()=>{
    elapsedMs += cycleMs;
    if(elapsedMs >= duration*1000){ stopAlertSound(); return; }
    playOnce();
  }, cycleMs);
}
function playBatchAlertSound(){
  playAlertSoundById(currentAlertSound());
}

function batchRemainingSeconds(){
  const b = state.activeBatch; if(!b) return 0;
  if(b.status==='paused') return b.remainingSecondsWhenPaused;
  if(!b.stepDeadline) return 0;
  return (new Date(b.stepDeadline).getTime() - Date.now())/1000;
}
function startBatchTicker(){
  stopBatchTicker();
  state._batchTicker = setInterval(()=>{
    if(!state.activeBatch || state.page!=='recipes') return;
    const b = state.activeBatch;
    if(b.status!=='running') return;
    const remaining = batchRemainingSeconds();
    const step = b.steps[b.currentStep];

    // audible alert when a timed step finishes — repeats every 15s until the step actually
    // advances, so it's heard on the factory floor even if the first chime is missed
    if(step && step.waitMinutes>0 && remaining<=0){
      const key = b.id+':'+b.currentStep+':'+b.stepDeadline;
      const now = Date.now();
      if(state._lastBeepKey!==key || !state._lastBeepAt || (now-state._lastBeepAt)>=15000){
        playBatchAlertSound();
        state._lastBeepKey = key;
        state._lastBeepAt = now;
      }
    }

    // auto-advance timed steps once their countdown hits zero (an Admin's or Blending staff's open browser drives this)
    if(step && step.waitMinutes>0 && remaining<=0 && canManageBlendBoard() && !state._autoAdvancing){
      state._autoAdvancing = true;
      nextBatchStep().finally(()=>{ state._autoAdvancing = false; });
      return;
    }

    const text = formatCountdown(remaining);
    ['batch-countdown','batch-focus-countdown'].forEach(id=>{
      const el = document.getElementById(id);
      if(el){ el.textContent = text; el.classList.toggle('done', remaining<=0); }
    });
    const noteEl = document.getElementById('batch-countdown-note');
    if(noteEl) noteEl.textContent = remaining<=0 ? "Time's up — ready for the next step" : 'remaining on this step';
  }, 1000);
}
function stopBatchTicker(){ if(state._batchTicker){ clearInterval(state._batchTicker); state._batchTicker=null; } }

// ---- Recipe CRUD ----
function newStepDraft(){ return {id:uid('STEP'), ingredient:'', amount:'', waitMinutes:0}; }
function newMaterialDraft(){ return {id:uid('MAT'), name:'', percent:0}; }
// Percentage-of-batch-weight formulation, e.g. { percent: 4 } on an 150kg batch needs 6kg.
// This is how the factory's real batch sheets are written, so a recipe's raw materials scale to
// any batch size instead of being locked to one fixed absolute weight.
function recipeMaterialAmount(percent, batchSizeKg){ return (Number(percent)||0)/100 * (Number(batchSizeKg)||0); }
function recipeMaterialsTotalPercent(materials){ return (materials||[]).reduce((sum,m)=>sum+(Number(m.percent)||0), 0); }
function openRecipeModal(id){
  const r = id ? byId(state.recipes, id) : null;
  state._recipeDraft = r
    ? {id:r.id, name:r.name, description:r.description||'', batchSizeKg:r.batchSizeKg||'', standardPH:r.standardPH||'', combineNote:r.combineNote||'',
       materials: (r.materials||[]).map(m=>({...m})), steps: r.steps.map(s=>({...s}))}
    : {id:null, name:'', description:'', batchSizeKg:'', standardPH:'', combineNote:'', materials:[newMaterialDraft()], steps:[newStepDraft()]};
  openModal('recipe:'+(id||'new'));
}
function draftAddStep(){ state._recipeDraft.steps.push(newStepDraft()); render(); }
function draftRemoveStep(stepId){
  if(state._recipeDraft.steps.length<=1) return;
  state._recipeDraft.steps = state._recipeDraft.steps.filter(s=>s.id!==stepId);
  render();
}
function draftMoveStep(stepId, dir){
  const steps = state._recipeDraft.steps;
  const i = steps.findIndex(s=>s.id===stepId);
  const j = i+dir;
  if(j<0 || j>=steps.length) return;
  [steps[i], steps[j]] = [steps[j], steps[i]];
  render();
}
function syncDraftTopFieldsFromDOM(){
  // pull the recipe-level fields (outside the step/material lists) into the draft before any
  // add/remove/reorder re-renders the form — otherwise those inputs reset to the draft's stale
  // value and whatever was typed in Recipe name, Batch size, etc. gets silently wiped.
  const d = state._recipeDraft;
  const form = document.getElementById('form-recipe');
  if(!form) return;
  if(form.name) d.name = form.name.value;
  if(form.description) d.description = form.description.value;
  if(form.batchSizeKg) d.batchSizeKg = form.batchSizeKg.value;
  if(form.standardPH) d.standardPH = form.standardPH.value;
  if(form.combineNote) d.combineNote = form.combineNote.value;
}
function syncDraftStepFieldsFromDOM(){
  // pull current input values into the draft before add/remove/reorder/submit, so nothing typed is lost
  const steps = state._recipeDraft.steps;
  steps.forEach(s=>{
    const ing = document.getElementById('step-ing-'+s.id);
    const amt = document.getElementById('step-amt-'+s.id);
    const wait = document.getElementById('step-wait-'+s.id);
    if(ing) s.ingredient = ing.value;
    if(amt) s.amount = amt.value;

}
function draftAddMaterial(){ state._recipeDraft.materials.push(newMaterialDraft()); render(); }
function draftRemoveMaterial(matId){

}
function draftMoveMaterial(matId, dir){
  const materials = state._recipeDraft.materials;
  const i = materials.findIndex(m=>m.id===matId);
  const j = i+dir;
  if(j<0 || j>=materials.length) return;
  [materials[i], materials[j]] = [materials[j], materials[i]];

}
function syncDraftMaterialFieldsFromDOM(){
  const materials = state._recipeDraft.materials;
  materials.forEach(m=>{
    const name = document.getElementById('mat-name-'+m.id);
    const pct = document.getElementById('mat-pct-'+m.id);

// Live-updates one material row's calculated amount, and the running total%, as you type —
// without a full render() (which would drop focus mid-keystroke).

function updateAllMaterialAmountPreviews(){

async function submitRecipe(e){
  e.preventDefault();
  const f = e.target;
  syncDraftStepFieldsFromDOM();
  syncDraftMaterialFieldsFromDOM();
  const steps = state._recipeDraft.steps
    .map(s=>({id:s.id, ingredient:(s.ingredient||'').trim(), amount:(s.amount||'').trim(), waitMinutes: Math.max(0, s.waitMinutes||0)}))
    .filter(s=>s.ingredient);
  const materials = state._recipeDraft.materials
    .map(m=>({id:m.id, name:(m.name||'').trim(), percent: Math.max(0, Number(m.percent)||0)}))

  };
  if(state._recipeDraft.id){
    const r = byId(state.recipes, state._recipeDraft.id);
    Object.assign(r, fields);
  }else{

// ---- Batch run controls (Admin only) ----
async function startBatch(recipeId, extra){
  const r = byId(state.recipes, recipeId); if(!r || !r.steps.length) return;
  extra = extra || {};
  const first = r.steps[0];
  state.activeBatch = {
    id: uid('BATCH'), recipeId: r.id, recipeName: r.name,
    productName: extra.productName || r.name, qty: extra.qty || '',
    batchNo: extra.batchNo || uid('BLD'), variation: extra.variation || '',
    steps: r.steps.map(s=>({...s})), currentStep: 0,
    status: 'running', stepDeadline: new Date(Date.now()+first.waitMinutes*60000).toISOString(),
    remainingSecondsWhenPaused: null, startedAt: new Date().toISOString(), startedBy: state.session.name
  };
  await save('activeBatch'); startBatchTicker();
  showToast('Batch started: '+r.name);
}
async function submitStartBatch(e){
  e.preventDefault();
  const f = e.target;
  await startBatch(f.dataset.recipeId, {
    productName: f.productName.value.trim(),
    qty: f.qty.value.trim(),
    batchNo: f.batchNo.value.trim(),
    variation: f.variation.value.trim()
  });
  closeModal();
}
async function pauseBatch(){
  const b = state.activeBatch; if(!b || b.status!=='running') return;
  b.remainingSecondsWhenPaused = Math.max(0, batchRemainingSeconds());
  b.status = 'paused';
  await save('activeBatch'); render();
}
async function resumeBatch(){
  const b = state.activeBatch; if(!b || b.status!=='paused') return;
  b.stepDeadline = new Date(Date.now() + (b.remainingSecondsWhenPaused||0)*1000).toISOString();
  b.status = 'running'; b.remainingSecondsWhenPaused = null;
  await save('activeBatch'); render();
}
async function nextBatchStep(){
  const b = state.activeBatch; if(!b) return;
  if(b.currentStep >= b.steps.length-1){
    b.status = 'completed';
    await save('activeBatch');
    await finishBatchIntoBlendingBoard(b);
    return;
  }
  b.currentStep += 1;
  const step = b.steps[b.currentStep];
  b.status = 'running';
  b.stepDeadline = new Date(Date.now()+step.waitMinutes*60000).toISOString();
  b.remainingSecondsWhenPaused = null;
  await save('activeBatch');
  showToast('Now: '+step.ingredient+(step.amount?(' — '+step.amount):''));
}
async function prevBatchStep(){
  const b = state.activeBatch; if(!b || b.currentStep<=0) return;
  b.currentStep -= 1;
  const step = b.steps[b.currentStep];
  b.status = 'running';
  b.stepDeadline = new Date(Date.now()+step.waitMinutes*60000).toISOString();
  b.remainingSecondsWhenPaused = null;
  await save('activeBatch'); render();
}
async function restartCurrentStep(){
  const b = state.activeBatch; if(!b) return;
  const step = b.steps[b.currentStep];
  b.status = 'running';
  b.stepDeadline = new Date(Date.now()+step.waitMinutes*60000).toISOString();
  b.remainingSecondsWhenPaused = null;
  await save('activeBatch'); render();
}
async function stopBatch(){
  const isDone = state.activeBatch && state.activeBatch.status==='completed';
  if(!isDone && !confirm('Stop this batch? Everyone watching will lose the live timer.')) return;
  state.activeBatch = null;
  await save('activeBatch'); stopBatchTicker();
  showToast('Batch stopped');
}
// Finishing a recipe's step timer feeds it into the Blending board as a real batch,
// then takes everyone watching straight there — no manual "Dismiss" click needed.
async function finishBatchIntoBlendingBoard(b){
  const batch = {
    id: uid('BLD'), batchNo: b.batchNo || uid('BLD'),
    product: b.productName || b.recipeName, qty: b.qty || '', variation: b.variation || '',
    priority: 'Medium', notes: '',
    stage: 0, assignee: null,
    createdAt: new Date().toISOString(),
    history: [{stage:0, at:new Date().toISOString(), by:state.session.name}]
  };
  state.blendBatches.unshift(batch);
  await save('blendBatches');
  state.activeBatch = null;
  await save('activeBatch');

}

// Material costs aren't tied to a fixed ingredients table — a recipe's materials are free-text

function renderCostingPage(){

// Picks an icon by keyword match on the product name, so the 6 default products each get
// a distinct, relevant glyph instead of one generic bottle — falls back to a plain bottle for
// any custom product name that doesn't match a known category.
function costingProductIcon(name){
  const n = (name||'').toLowerCase();
  if(n.includes('shampoo')) return 'shampoo';
  if(n.includes('condition')) return 'conditioner';
  if(n.includes('lotion')) return 'bodylotion';

  if(n.includes('hand') && n.includes('wash')) return 'handwash';

function costingLineAmount(percent, batchKg){ return (Number(percent)||0)/100 * (Number(batchKg)||0); }
// Water is conventionally "q.s. to 100%" in a cosmetic recipe — it fills whatever
// percentage the other raw materials don't already account for, rather than being
// typed in by hand. Matched by name so it works whether the row is called "Water" or
// "DI Water"/"Di Water".
function isWaterMaterial(m){ return /\bwater\b/i.test(m.name||''); }
// Recomputes the water row's percent to make the sheet total 100%, unless the row just
// edited (editedId) IS the water row itself — a direct edit to water's own percent is
// respected rather than immediately overwritten. Returns true if water's percent changed.
function costingAutoBalanceWater(draft, editedId){
  const materials = draft.materials||[];
  const water = materials.find(isWaterMaterial);
  if(!water || water.id===editedId) return false;
  const sumOthers = materials.filter(m=>m.id!==water.id).reduce((s,m)=>s+(Number(m.percent)||0), 0);
  const newPct = Math.max(0, Math.round((100-sumOthers)*1000)/1000);
  if(newPct===water.percent) return false;
  water.percent = newPct;
  return true;
}

function costingSupplierShortLabel(name){
  const trimmed = (name||'').trim();

}

// Live-recomputes the Amount/Cost cells for one row (and the Total row) directly via the DOM,
// instead of a full render() on every keystroke — keeps the sheet feeling like a live
// spreadsheet and never interrupts typing or drops focus. Edits land in state._costingDraft
// only; nothing is persisted until the Save button explicitly replaces or forks the version.
function costingOnFieldInput(el){
  const draft = state._costingDraft;
  if(!draft) return;
  const m = (draft.materials||[]).find(x=>x.id===el.dataset.mat);
  if(!m) return;
  const field = el.dataset.field;
  if(field==='percent' || field==='costPerKg'){
    m[field] = Math.max(0, parseFloat(el.value)||0);
    costingRecomputeRow(draft, m);
    if(field==='percent' && costingAutoBalanceWater(draft, m.id)){
      const water = draft.materials.find(isWaterMaterial);
      costingRecomputeRow(draft, water);
      const waterInput = document.querySelector(`.cst-field[data-field="percent"][data-mat="${water.id}"]`);
      if(waterInput) waterInput.value = water.percent;
    }
    costingRecomputeTotals(draft);
  } else {
    m[field] = el.value;
    if(field==='name' && costingAutoBalanceWater(draft, m.id)){
      const water = draft.materials.find(isWaterMaterial);
      costingRecomputeRow(draft, water);
      const waterInput = document.querySelector(`.cst-field[data-field="percent"][data-mat="${water.id}"]`);
      if(waterInput) waterInput.value = water.percent;
      costingRecomputeTotals(draft);
    }
  }
  state._costingDirty = true;
}
function costingRecomputeRow(draft, m){
  (draft.batchSizes||[]).forEach(sz=>{
    const amt = costingLineAmount(m.percent, sz);
    const cost = amt * (Number(m.costPerKg)||0);
    const amtEl = document.querySelector(`.cst-amt[data-mat="${m.id}"][data-size="${sz}"]`);
    const costEl = document.querySelector(`.cst-cost[data-mat="${m.id}"][data-size="${sz}"]`);
    if(amtEl) amtEl.textContent = amt.toFixed(3);
    if(costEl) costEl.textContent = 'Rs. ' + cost.toFixed(2);
  });
}
function costingRecomputeTotals(draft){
  const materials = draft.materials||[];
  const totalPct = materials.reduce((s,m)=>s+(Number(m.percent)||0), 0);
  const totalUnitPrice = materials.reduce((s,m)=>s+(Number(m.costPerKg)||0), 0);
  const pctEl = document.getElementById('cst-total-percent'); if(pctEl) pctEl.textContent = totalPct.toFixed(2)+'%';
  const upEl = document.getElementById('cst-total-unitprice'); if(upEl) upEl.textContent = 'Rs. '+totalUnitPrice.toFixed(2);
  (draft.batchSizes||[]).forEach(sz=>{
    const amtSum = materials.reduce((s,m)=>s+costingLineAmount(m.percent, sz), 0);
    const costSum = materials.reduce((s,m)=>s+costingLineAmount(m.percent, sz)*(Number(m.costPerKg)||0), 0);
    const amtEl = document.getElementById('cst-total-amt-'+sz); if(amtEl) amtEl.textContent = amtSum.toFixed(3);
    const costEl = document.getElementById('cst-total-cost-'+sz); if(costEl) costEl.textContent = 'Rs. '+costSum.toFixed(2);
  });
}

// Recalculates every raw material's amount + the totals row as the batch size input changes,
// without a full render() (keeps the input focused mid-keystroke).
function updateBatchSheetAmounts(recipeId){
  const r = byId(state.recipes, recipeId); if(!r) return;
  const sizeEl = document.getElementById('sheet-batch-size');
  const batchSizeKg = parseFloat(sizeEl && sizeEl.value)||0;
  let totalAmt = 0;
  (r.materials||[]).forEach(m=>{
    const amt = recipeMaterialAmount(m.percent, batchSizeKg);
    totalAmt += amt;
    const cell = document.querySelector('.sheet-amt[data-mat-id="'+m.id+'"]');
    if(cell) cell.textContent = amt.toFixed(3);
  });
  const totalAmtEl = document.getElementById('sheet-total-amt');
  if(totalAmtEl) totalAmtEl.textContent = totalAmt.toFixed(3);
}

function activityLogModal(){
  const all = state.activityLog||[];
  const q = (state.filters.activityLogSearch||'').trim().toLowerCase();
  const monthF = state.filters.activityLogMonth||'';
  const dateF = state.filters.activityLogDate||'';
  const userF = state.filters.activityLogUser||'';
  const users = [...new Set(all.map(l=>l.actor))].sort((a,b)=>a.localeCompare(b));
  const months = [...new Set(all.map(l=>l.at.slice(0,7)))].sort().reverse();
  const anyFilterActive = !!(q||monthF||dateF||userF);
  let filtered = all;
  if(q) filtered = filtered.filter(l=>l.actor.toLowerCase().includes(q) || l.message.toLowerCase().includes(q));
  if(monthF) filtered = filtered.filter(l=>l.at.slice(0,7)===monthF);
  if(dateF) filtered = filtered.filter(l=>l.at.slice(0,10)===dateF);
  if(userF) filtered = filtered.filter(l=>l.actor===userF);
  const rows = filtered.slice(0, 500);
  return `

    <div class="modal" style="max-width:760px;max-height:85vh;display:flex;flex-direction:column;">

          ${months.map(m=>`<option value="${m}" ${m===monthF?'selected':''}>${esc(fmtMonthLabel(m))}</option>`).join('')}
        </select>
        <input type="date" id="activitylog-date-filter" value="${esc(dateF)}" style="padding:6px 10px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--ink);font:inherit;">
        <select id="activitylog-user-filter" style="padding:7px 10px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--ink);font:inherit;">
          <option value="">All people</option>
          ${users.map(u=>`<option value="${escAttr(u)}" ${u===userF?'selected':''}>${esc(u)}</option>`).join('')}
        </select>

      </div>
      <div style="overflow-y:auto;flex:1;border:1px solid var(--border);border-radius:8px;min-height:120px;">
        ${rows.length===0 ? `<div class="empty-state">No activity ${anyFilterActive?'matches these filters':'logged yet'}.</div>` : `
        <table class="data-table">
          <thead><tr><th>When</th><th>Who</th><th>Action</th></tr></thead>
          <tbody>
            ${rows.map(l=>`<tr><td style="white-space:nowrap;">${fmtDateTime(l.at)}</td><td style="white-space:nowrap;">${esc(l.actor)}</td><td>${esc(l.message)}</td></tr>`).join('')}

        <button type="button" class="btn" id="btn-cancel-modal">Close</button>
      </div>
    </div>
  </div>`;

// A single styled stand-in for the browser's native confirm() dialog — opened with
// openConfirmModal({title, sub, message, confirmLabel, danger, action, payload}) and resolved
// by runConfirmedAction(), which switches on `action` to perform the right effect. Keeps every
// "are you sure?" in the app visually consistent instead of the OS's own dark popup.
function openConfirmModal(opts){

      <div class="hint" id="confirm-action-password-error" style="color:var(--danger);"></div>
      ` : ''}
      <div class="modal-actions">
        <button type="button" class="btn" id="btn-cancel-modal">Cancel</button>
        <button type="button" class="btn ${c.danger?'btn-danger':'btn-primary'}" id="btn-confirm-action">${esc(c.confirmLabel||'OK')}</button>
      </div>

// Looks up the signed-in user's own stored password the same way sign-in does (named login
// for roles that have them, otherwise the role's shared password) and checks it against what
// they just typed — used to re-confirm identity before a destructive action goes through.
async function verifyCurrentUserPassword(password){
  const role = state.session.role;
  const logins = state.auth.roleLogins && state.auth.roleLogins[role];
  if(logins && logins.length){
    const match = logins.find(l=>l.name.toLowerCase()===(state.session.name||'').toLowerCase());
    return !!match && await passwordMatches(password, match.password);
  }
  const expected = role==='Admin' ? state.auth.adminPassword : (role==='Sub Admin' ? state.auth.subAdminPassword : (role==='Blending' ? state.auth.blendingPassword : (role==='Customer Care' ? state.auth.customerCarePassword : state.auth.packingPassword)));
  return password === expected;
}
async function runConfirmedAction(){
  const c = state._confirmAction;
  if(!c) return;
  if(c.requirePassword){
    const pwInput = document.getElementById('confirm-action-password');
    const errEl = document.getElementById('confirm-action-password-error');
    const ok = await verifyCurrentUserPassword(pwInput ? pwInput.value : '');
    if(!ok){
      if(errEl) errEl.textContent = 'Incorrect password.';
      if(pwInput){ pwInput.value = ''; pwInput.focus(); }
      return;
    }
  }
  switch(c.action){
    case 'delete-costing-material': {
      const draft = state._costingDraft;
      if(draft){
        draft.materials = (draft.materials||[]).filter(m=>m.id!==c.payload);
        costingAutoBalanceWater(draft, null);
        state._costingDirty = true;
      }
      closeModal();
      break;
    }
    case 'delete-costing-version': {
      const product = state.costingProducts.find(p=>p.id===state._costingOpenProductId);
      const version = product && (product.versions||[]).find(v=>v.id===c.payload);
      if(version){
        version.archived = true;
        version.archivedAt = new Date().toISOString();
        version.archivedBy = state.session.staffName || state.session.name;
        await save('costingProducts');
        logActivity(`Archived costing version "${version.name}" (${product.name})`);
        state._costingVersionsView = 'archive';
      }
      closeModal();
      break;
    }
    case 'delete-costing-version-permanent': {
      const product = state.costingProducts.find(p=>p.id===state._costingOpenProductId);
      const version = product && (product.versions||[]).find(v=>v.id===c.payload);
      if(product){
        product.versions = (product.versions||[]).filter(v=>v.id!==c.payload);
        await save('costingProducts');
        logActivity(`Permanently deleted costing version "${version?version.name:c.payload}" (${product.name})`);
      }
      closeModal();
      break;
    }
    case 'delete-costing-product': {
      const product = byId(state.costingProducts, c.payload);
      state.costingProducts = state.costingProducts.filter(p=>p.id!==c.payload);
      await save('costingProducts');
      logActivity(`Deleted product costing "${product?product.name:c.payload}"`);
      closeModal();
      break;
    }
    default: closeModal();
  }
  state._confirmAction = null;
}

const COMPLAINT_LOCK_AFTER_MS = 60*60*1000;
// Customer Care can only log a new complaint — the moment it's saved it's frozen for them, and
// only Admin/Sub Admin can open it again to assign a representative or move its status forward.
// For any other non-admin role that ends up with complaints access, the older rule still applies:
// locked once Resolved/Closed (moved to the archive), or after an hour has passed since logging.
// "Locked" means fully read-only, no interaction at all — used for the archive (Resolved/Closed)
// and, for any non-admin, non-Customer-Care role that ends up with complaints access, the older
// one-hour-after-logging rule. Customer Care is handled separately in complaintFormModal: they're
// never "locked" out of a running complaint entirely, just restricted to the update log on it.
function isComplaintLocked(c){
  if(!c || isAdmin() || isSubAdmin()) return false;
  if(c.status==='Resolved' || c.status==='Closed') return true;
  if(state.session && state.session.role==='Customer Care') return false;
  return Date.now() - new Date(c.createdAt).getTime() > COMPLAINT_LOCK_AFTER_MS;
}
function archivedComplaints(){ return state.complaints.filter(c=>c.archived).sort((a,b)=>new Date(b.archivedAt||0)-new Date(a.archivedAt||0)); }
const COMPLAINT_ARCHIVE_AFTER_MS = 2*60*60*1000; // closed complaints auto-archive 2 hours after being closed
function sweepClosedComplaints(){
  const now = Date.now();
  let changed = false;
  state.complaints.forEach(c=>{
    if(c.status!=='Closed' || c.archived) return;
    if(!c.closedAt){ c.archived = true; c.archivedAt = new Date().toISOString(); changed = true; return; }
    if(now - new Date(c.closedAt).getTime() >= COMPLAINT_ARCHIVE_AFTER_MS){
      c.archived = true; c.archivedAt = new Date().toISOString(); changed = true;
    }
  });
  return changed;
}
// Once a complaint has been assigned, only Admin/Sub Admin and the person it's assigned to
// (matched by their own login name, for named logins) can open it. Customer Care is exempt from
// this — they can open any running complaint to add an update, regardless of who it's assigned to.
function canOpenComplaint(c){
  if(!c || isAdmin() || isSubAdmin()) return true;
  if(state.session && state.session.role==='Customer Care') return true;
  if(!c.assignedTo) return true;
  const myName = state.session && (state.session.staffName || state.session.name);
  return myName===c.assignedTo;
}
function openComplaint(id){
  const c = byId(state.complaints, id);
  if(c && !canOpenComplaint(c)){
    showToast(`This complaint is assigned to ${c.assignedTo} — only they or Admin can open it.`);
    return;
  }
  openModal('complaint:'+id);
}
// Normalizes a complaint's update log, migrating the single customerUpdateStatus/logUpdate
// fields from before this was a timestamped history into a one-entry array.
function complaintUpdates(c){
  if(Array.isArray(c.updates)) return c.updates;
  if(c.customerUpdateStatus || c.logUpdate){
    return [{status: c.customerUpdateStatus||'Not Updated', note: c.logUpdate||'', at: c.createdAt, by: 'Admin'}];
  }
  return [];
}

// Wires a text input to a white, correctly-sized custom suggestion dropdown of matching
// customer names — used instead of native <input list=datalist>, whose popup styling
// (background, width) can't be controlled via CSS and renders using OS/browser theming.
function attachCustomerAutocomplete(input, suggestionsEl, applyMatch){
  if(!input || !suggestionsEl) return;
  const matchByName = name => state.customers.find(cu=>cu.name.trim().toLowerCase()===name.trim().toLowerCase());
  const hide = ()=>{ suggestionsEl.style.display='none'; suggestionsEl.innerHTML=''; };
  const show = ()=>{
    const typed = input.value.trim().toLowerCase();
    if(!typed){ hide(); return; }
    const matches = state.customers.filter(cu=>cu.name.toLowerCase().includes(typed)).slice(0,8);
    if(matches.length===0){ hide(); return; }
    suggestionsEl.innerHTML = matches.map(cu=>`<div class="ac-item" data-name="${escAttr(cu.name)}">${esc(cu.name)}</div>`).join('');
    suggestionsEl.style.display='block';
  };
  input.addEventListener('input', ()=>{
    show();
    const match = matchByName(input.value);
    if(match) applyMatch(match);
  });
  input.addEventListener('focus', show);
  suggestionsEl.addEventListener('mousedown', (e)=>{
    const item = e.target.closest('.ac-item');
    if(!item) return;
    e.preventDefault();
    input.value = item.dataset.name;
    const match = matchByName(item.dataset.name);
    if(match) applyMatch(match);
    hide();
  });
  input.addEventListener('blur', ()=>setTimeout(hide, 150));
}
// A costing sheet can have many Supplier fields (one per raw material row), so rather than
// attaching a dropdown to each, one shared dropdown is positioned under whichever row's input
// is currently focused — fixed-positioned so it isn't clipped by the sheet's horizontal scroll.
// Adds a supplier name as a removable tag on a raw material row (max two per row — a row
// already holding two is left alone rather than silently dropping the oldest one).
function costingAddSupplierTag(matId, name){
  const draft = state._costingDraft;
  if(!draft) return;
  const m = (draft.materials||[]).find(x=>x.id===matId);
  if(!m) return;
  if(!Array.isArray(m.suppliers)) m.suppliers = [];
  name = (name||'').trim();
  if(!name || m.suppliers.length>=2 || m.suppliers.includes(name)) return;
  m.suppliers.push(name);
  state._costingDirty = true;
  render();
}
function costingRemoveSupplierTag(matId, idx){
  const draft = state._costingDraft;
  if(!draft) return;
  const m = (draft.materials||[]).find(x=>x.id===matId);
  if(!m || !Array.isArray(m.suppliers)) return;
  m.suppliers.splice(idx, 1);
  state._costingDirty = true;
  render();
}
function attachCostingSupplierAutocomplete(){
  const dropdown = document.getElementById('costing-supplier-dropdown');
  if(!dropdown) return;
  let activeInput = null;
  const hide = ()=>{ dropdown.style.display='none'; dropdown.innerHTML=''; activeInput=null; };
  const show = (input)=>{
    const typed = input.value.trim().toLowerCase();
    if(!typed){ hide(); return; }
    const names = [...new Set(state.suppliers.map(s=>s.name).filter(Boolean))];
    const matches = names.filter(n=>n.toLowerCase().includes(typed)).slice(0,8);
    if(matches.length===0){ hide(); return; }
    activeInput = input;
    const r = input.getBoundingClientRect();
    dropdown.style.position = 'fixed';
    dropdown.style.margin = '0';
    dropdown.style.left = r.left+'px';
    dropdown.style.right = 'auto';
    dropdown.style.top = (r.bottom+4)+'px';
    dropdown.style.width = Math.max(r.width,180)+'px';
    dropdown.innerHTML = matches.map(n=>`<div class="ac-item" data-name="${escAttr(n)}">${esc(n)}</div>`).join('');
    dropdown.style.display = 'block';
  };
  document.querySelectorAll('.cst-supplier-input').forEach(input=>{
    input.addEventListener('input', ()=>show(input));
    input.addEventListener('focus', ()=>show(input));
    input.addEventListener('blur', ()=>setTimeout(hide, 150));
    input.addEventListener('keydown', (e)=>{
      if(e.key==='Enter'){
        e.preventDefault();
        costingAddSupplierTag(input.dataset.mat, input.value);
        hide();
      }
    });
  });
  dropdown.addEventListener('mousedown', (e)=>{
    const item = e.target.closest('.ac-item');
    if(!item || !activeInput) return;
    e.preventDefault();
    costingAddSupplierTag(activeInput.dataset.mat, item.dataset.name);
    hide();

// One shared color-palette popover for every row's color trigger button, positioned under
// whichever trigger was clicked — keeps every row's own cell down to a single small button
// instead of showing all 7 swatches inline on every row.
let _rowColorDocClickHandler = null;
function attachCostingRowColorPicker(){
  const dropdown = document.getElementById('costing-rowcolor-dropdown');
  if(!dropdown) return;
  if(_rowColorDocClickHandler) document.removeEventListener('click', _rowColorDocClickHandler);
  let activeMatId = null;
  const hide = ()=>{ dropdown.style.display='none'; activeMatId=null; };
  document.querySelectorAll('[data-row-color-trigger]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(activeMatId===btn.dataset.rowColorTrigger){ hide(); return; }
      activeMatId = btn.dataset.rowColorTrigger;
      const r = btn.getBoundingClientRect();
      dropdown.style.left = r.left+'px';
      dropdown.style.top = (r.bottom+4)+'px';
      dropdown.style.display = 'flex';
    });
  });
  dropdown.querySelectorAll('[data-pick-row-color]').forEach(b=>{
    b.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(!activeMatId) return;
      const draft = state._costingDraft;
      const m = draft && (draft.materials||[]).find(x=>x.id===activeMatId);
      if(m){ m.rowColor = b.dataset.pickRowColor || null; state._costingDirty = true; }
      hide();
      render();
    });
  });
  _rowColorDocClickHandler = ()=>hide();
  document.addEventListener('click', _rowColorDocClickHandler);
}

<script>
// ===================== PWA: installable app shell + basic offline resilience =====================
// Lets this run from a home-screen / desktop app icon instead of a browser tab.
// Data still comes from Supabase live — this only caches the page shell so it opens
// instantly and survives a flaky connection; it does not work fully offline.
if('serviceWorker' in navigator){
  // The fetch handler must force a genuine network round-trip (cache:'reload') — a plain
  // fetch() here would let the browser's own HTTP cache quietly hand back a stale response,
  // which this service worker would then re-cache and serve as if it were fresh. That made a
  // normal hard-refresh (which bypasses the PAGE's cache, but not this worker's own fetch
  // decision) look like it did nothing: the page reloaded, but this code still handed it
  // yesterday's app. Also bump CACHE and clear old caches on activate so nothing stale lingers.
  const swSource = `
    const CACHE = 'audrey-care-shell-v2';
    self.addEventListener('install', e => { self.skipWaiting(); });
    self.addEventListener('activate', e => {
      e.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))));
      self.clients.claim();
    });
    self.addEventListener('fetch', e => {
      if(e.request.method !== 'GET') return;
      e.respondWith(
        fetch(e.request, {cache: 'reload'}).then(res => {
          const copy = res.clone();
          caches.open(CACHE).then(c => c.put(e.request, copy)).catch(()=>{});
          return res;
        }).catch(() => caches.match(e.request))
      );
    });
  `;
  const swBlobUrl = URL.createObjectURL(new Blob([swSource], {type:'application/javascript'}));
  window.addEventListener('load', () => {
    navigator.serviceWorker.register(swBlobUrl).catch(()=>{ /* best-effort */ });
  });
}
</script>
