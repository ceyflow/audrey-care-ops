<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#20291F;
    --bg:#F2F9F4;
    --surface:#FFFFFF;
    --sidebar-bg:#FFFFFF;
    --border:#D9EDE0;
    --muted:#6C8071;
    --accent:#4CAF6D;
    --accent-dark:#3C9058;
    --accent-soft:#E4F8EA;
    --accent-grad:linear-gradient(90deg,#5CC084,#3FA968);
    --clay:#B5651D;
    --clay-soft:#F5E7DA;
    --danger:#C15B4E;
    --danger-soft:#FCEEEB;
    --s-received:#64748B;   --s-received-soft:#E9ECF0;
    --s-blending:#A8790F;   --s-blending-soft:#F5EBD4;
    --s-packing:#3B6E8F;    --s-packing-soft:#E2EBF0;
    --s-dispatch:#6B5B95;   --s-dispatch-soft:#EBE7F2;
    --s-delivered:#3FA968;  --s-delivered-soft:#E4F8EA;
    --s-qc:#B14B3F;         --s-qc-soft:#FBEEEC;
    --s-mixing:#2E8B8B;     --s-mixing-soft:#E3F3F3;
    --radius:10px;
    --sidebar-w:240px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    font-size:14px;
    line-height:1.5;
  }
  .wordmark{font-family:'Fraunces',serif;font-style:italic;font-weight:500;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14px;}
  a{color:inherit;}

  /* ---------------- Shell / Sidebar ---------------- */
  .shell{display:flex;min-height:100vh;}
  .shell-enter{animation:shell-enter .35s ease-out;}
  @keyframes shell-enter{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .sidebar{
    width:var(--sidebar-w);flex-shrink:0;
    background:var(--sidebar-bg);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;
    position:fixed;top:0;bottom:0;left:0;
    overflow-y:auto;
    z-index:40;transition:transform .2s ease;
  }
  .sidebar-backdrop{display:none;}
  .sidebar .brand{padding:22px 20px 16px;border-bottom:1px solid var(--border);}
  .sidebar .brand .wordmark{font-size:21px;color:var(--accent-dark);}
  .sidebar .brand .brand-logo{display:block;height:44px;width:auto;object-fit:contain;}
  .sidebar .brand .tagline{display:block;font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:.01em;}
  .nav-group{padding:16px 12px 4px;}
  .nav-group .group-label{font-size:11px;color:var(--muted);padding:0 10px 6px;font-weight:600;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:9px 12px;border-radius:8px;
    font-size:13.5px;font-weight:500;color:var(--ink);
    margin-bottom:2px;
    text-decoration:none;cursor:pointer;
  }
  .nav-item svg{width:17px;height:17px;flex-shrink:0;color:var(--muted);transition:transform .2s ease;}
  .nav-item:hover{background:var(--bg);}
  .nav-item:hover svg{animation:icon-pop .38s ease;}
  .nav-item.active{background:var(--accent-soft);color:var(--accent-dark);}
  .nav-item.active svg{color:var(--accent-dark);}
  @keyframes icon-pop{0%{transform:scale(1) rotate(0);}45%{transform:scale(1.22) rotate(-8deg);}100%{transform:scale(1) rotate(0);}}
  .nav-item.nav-item-unread svg{color:var(--danger);animation:nav-icon-pulse 1.3s ease-in-out infinite;}
  .nav-unread-dot{width:8px;height:8px;border-radius:50%;background:var(--danger);margin-left:auto;flex-shrink:0;animation:pulse-dot 1.6s infinite;}
  @keyframes nav-icon-pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.24);}}
  .nav-item-row{display:flex;align-items:center;}
  .nav-expand-btn{background:none;border:none;padding:6px;margin:0 0 2px;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:6px;}
  .nav-expand-btn:hover{background:var(--bg);}
  .nav-expand-btn svg{width:14px;height:14px;transition:transform .18s ease;}
  .nav-expand-btn.open svg{transform:rotate(90deg);}
  .nav-subitems{display:flex;flex-direction:column;margin:0 0 4px;}
  .nav-subitem{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 39px;font-size:13px;font-weight:500;color:var(--muted);text-decoration:none;border-radius:8px;margin-bottom:2px;}
  .nav-subitem:hover{background:var(--bg);color:var(--ink);}
  .nav-subitem.active{background:var(--accent-soft);color:var(--accent-dark);font-weight:600;}
  .nav-subitem-dash{color:inherit;opacity:.6;}

  .pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--danger);display:inline-block;margin-right:7px;animation:pulse-dot 1.8s infinite;}
  @keyframes pulse-dot{0%{box-shadow:0 0 0 0 rgba(177,75,63,.5);}70%{box-shadow:0 0 0 7px rgba(177,75,63,0);}100%{box-shadow:0 0 0 0 rgba(177,75,63,0);}}

  .toast{position:fixed;bottom:60px;right:22px;max-width:380px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;box-shadow:0 10px 28px rgba(0,0,0,.2);z-index:300;animation:toast-in .25s ease;}
  .chat-notice{position:fixed;top:20px;right:22px;background:#fff;border:1px solid var(--border);border-left:5px solid var(--accent);color:var(--ink);padding:18px 22px;border-radius:14px;display:flex;align-items:flex-start;gap:14px;max-width:440px;min-width:300px;box-shadow:0 18px 44px rgba(30,60,40,.2);z-index:320;cursor:pointer;animation:toast-in .28s ease;}
  .chat-notice:hover{background:var(--bg);}
  .chat-notice-icon{font-size:26px;line-height:1;margin-top:1px;}
  .chat-notice-sender{font-weight:700;font-size:14.5px;color:var(--accent-dark);margin-bottom:4px;}
  .chat-notice-text{font-size:15px;color:var(--ink);line-height:1.5;white-space:pre-wrap;word-break:break-word;}
  @keyframes toast-in{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  .chat-menu-btn{border:none;background:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:1px 4px;border-radius:4px;}
  .chat-menu-btn:hover{background:var(--bg);color:var(--ink);}
  .chat-dropdown{position:absolute;top:22px;z-index:30;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 28px rgba(20,25,20,.14);padding:6px;display:flex;flex-direction:column;min-width:160px;}
  .chat-dropdown button{border:none;background:none;text-align:left;padding:8px 10px;border-radius:6px;font-size:13px;color:var(--ink);cursor:pointer;white-space:nowrap;}
  .chat-dropdown button:hover{background:var(--bg);}
  .chat-like-badge{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);margin-top:4px;background:var(--bg);border-radius:99px;padding:2px 8px;width:fit-content;}
  .chat-quote-inline{border-left:3px solid var(--accent);padding:4px 9px;margin-bottom:6px;font-size:12px;opacity:.85;border-radius:4px;}
  .chat-quote-inline-sender{font-weight:600;margin-bottom:1px;}
  .chat-quote-banner{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:10px 18px;background:var(--bg);border-top:1px solid var(--border);}
  .chat-quote-banner-sender{font-size:11.5px;font-weight:600;color:var(--accent-dark);margin-bottom:2px;}
  .chat-quote-banner-text{font-size:12.5px;color:var(--muted);max-width:480px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .chat-quote-cancel{border:none;background:none;color:var(--muted);cursor:pointer;font-size:14px;flex-shrink:0;}
  .chat-quote-cancel:hover{color:var(--ink);}
  .chat-edit-form textarea{width:260px;max-width:100%;min-height:60px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;font-family:inherit;resize:vertical;}
  .chat-edit-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:6px;}
  .toast svg{width:18px;height:18px;flex-shrink:0;}
  .toast svg path{stroke-dasharray:28;stroke-dashoffset:28;animation:check-draw .45s ease forwards .1s;}
  @keyframes check-draw{to{stroke-dashoffset:0;}}

  .btn svg{width:14px;height:14px;transition:transform .2s ease;vertical-align:-2px;margin-right:4px;}

  .btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;transition:background .15s,border-color .15s,transform .15s ease,box-shadow .15s ease;}

  .btn:active{transform:translateY(0);box-shadow:none;}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}

  main.page{padding:22px 26px 70px;max-width:1400px;}

  /* ---------------- Motion: page entrance ---------------- */
  @keyframes content-enter{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  .page-enter > *{animation:content-enter .42s cubic-bezier(.16,.84,.44,1) both;}
  .page-enter > *:nth-child(1){animation-delay:.02s;}
  .page-enter > *:nth-child(2){animation-delay:.07s;}
  .page-enter > *:nth-child(3){animation-delay:.12s;}
  .page-enter > *:nth-child(4){animation-delay:.17s;}
  .page-enter > *:nth-child(n+5){animation-delay:.2s;}
  .page-enter .stat-grid > .stat-card{animation:content-enter .38s cubic-bezier(.16,.84,.44,1) both;}
  .page-enter .stat-grid > .stat-card:nth-child(1){animation-delay:.06s;}
  .page-enter .stat-grid > .stat-card:nth-child(2){animation-delay:.11s;}
  .page-enter .stat-grid > .stat-card:nth-child(3){animation-delay:.16s;}
  .page-enter .stat-grid > .stat-card:nth-child(n+4){animation-delay:.2s;}
  .page-enter .board > .column{animation:content-enter .4s cubic-bezier(.16,.84,.44,1) both;}
  .page-enter .board > .column:nth-child(1){animation-delay:.05s;}
  .page-enter .board > .column:nth-child(2){animation-delay:.1s;}
  .page-enter .board > .column:nth-child(3){animation-delay:.15s;}
  .page-enter .board > .column:nth-child(4){animation-delay:.2s;}
  .page-enter .board > .column:nth-child(n+5){animation-delay:.24s;}
  .page-enter .column-body > .card{animation:content-enter .32s ease-out both;}
  .page-enter .column-body > .card:nth-child(1){animation-delay:.1s;}
  .page-enter .column-body > .card:nth-child(2){animation-delay:.15s;}
  .page-enter .column-body > .card:nth-child(3){animation-delay:.2s;}
  .page-enter .column-body > .card:nth-child(n+4){animation-delay:.24s;}
  @media (prefers-reduced-motion: reduce){
    .page-enter > *, .page-enter .stat-grid > .stat-card, .page-enter .board > .column, .page-enter .column-body > .card,
    .login-blob{ animation: none !important; }
  }

  /* ---------------- Stat cards ---------------- */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;transition:transform .18s ease,box-shadow .18s ease;}
  .stat-card:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(20,25,20,.08);}
  .stat-card .label{font-size:12px;color:var(--muted);margin-bottom:6px;}
  .stat-card .value{font-size:24px;font-weight:600;}
  .stat-card .value.accent{color:var(--accent-dark);}
  .stat-card .value.danger{color:var(--danger);}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto;overflow-y:hidden;margin-bottom:20px;-webkit-overflow-scrolling:touch;}
  .panel-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .panel-head h3{margin:0;font-size:14.5px;font-weight:600;}
  .panel-body{padding:16px 18px;}

  .stage-breakdown{display:flex;flex-direction:column;gap:10px;}
  .sb-row{display:flex;align-items:center;gap:10px;font-size:13px;}
  .sb-row .sb-label{width:110px;flex-shrink:0;color:var(--muted);}
  .sb-row .sb-bar-track{flex:1;height:8px;border-radius:99px;background:var(--bg);overflow:hidden;}
  .sb-row .sb-bar-fill{height:100%;border-radius:99px;}
  .sb-row .sb-count{width:24px;text-align:right;font-weight:600;}

  /* ---------------- Tables ---------------- */
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .search-input{padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);min-width:220px;}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .tab{padding:7px 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:6px;}
  .tab svg{width:14px;height:14px;}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  table.data-table{width:100%;border-collapse:collapse;font-size:13px;}
  table.data-table th{
    text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;
    padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;
  }
  table.data-table td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
  table.data-table tr:last-child td{border-bottom:none;}
  table.data-table tr.clickable:hover{background:var(--bg);cursor:pointer;}
  /* Costing sheets run wide (many batch-size columns) and tall (many raw materials) — a plain
     hairline between rows gets lost when your eye is tracking sideways across the table, so
     every row gets a light tint and a firmer divider instead of just the thin default border. */
  table.costing-table tbody tr{background:var(--bg);}
  table.costing-table tbody td, table.costing-table tbody th{border-bottom:1px solid var(--border);}
  table.costing-table tbody tr:last-child td{border-bottom:1px solid var(--border);}
  table.costing-table tfoot td{border-top:2px solid var(--ink);background:var(--accent-soft);}
  /* Each batch size contributes an Amount+Cost pair, and with several sizes on one sheet it's
     easy to lose track of where one pair ends and the next begins — a firm vertical rule before
     every "Amount for …kg" column (the start of each pair) breaks the sheet into clear groups. */
  table.costing-table .cst-group-start{border-left:2px solid var(--border);padding-left:10px;}
  table.costing-table thead .cst-group-start{border-left:2px solid var(--ink);}
  table.costing-table tfoot .cst-group-start{border-left:2px solid var(--ink);}
  /* Compact sizing — a costing sheet has many columns and rows, so a smaller, tighter grid
     keeps more of it on screen at once than the app's normal table density. */
  table.costing-table th{padding:7px 10px;font-size:11px;}
  table.costing-table td{padding:5px 10px;font-size:12px;}

  .checklist-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:10px;}
  table.checklist-grid{border-collapse:collapse;font-size:11.5px;white-space:nowrap;}

  table.checklist-grid th{background:var(--bg);color:var(--muted);font-weight:600;font-size:11px;}

  .checklist-cell{cursor:pointer;width:30px;height:26px;font-weight:700;font-size:11px;user-select:none;}
  .checklist-cell:hover{outline:2px solid var(--accent);outline-offset:-2px;}
  .checklist-signoff-input{width:70px;font-size:11px;padding:3px 4px;border:1px solid var(--border);border-radius:5px;text-align:center;}
  .checklist-sign-btn{width:70px;min-height:36px;padding:3px 4px;border:1px dashed var(--border);border-radius:5px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;}

  .checklist-sign-thumb .checklist-sign-name{font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:66px;}
  .sign-pad-canvas{border:1px solid var(--border);border-radius:8px;background:#fff;touch-action:none;cursor:crosshair;width:100%;max-width:360px;height:150px;}

  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;font-size:11px;color:var(--muted);font-weight:600;text-align:center;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-day{aspect-ratio:1/1;min-height:56px;border:1px solid var(--border);border-radius:8px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;position:relative;font-family:inherit;}
  .cal-day:hover{border-color:var(--accent);background:var(--accent-soft);}

  .day-task-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;text-align:left;cursor:pointer;width:100%;font-family:inherit;font-size:13px;}
  .day-task-row:hover{border-color:var(--accent);}
  .day-task-status{font-weight:700;padding:4px 10px;border-radius:999px;font-size:11.5px;flex-shrink:0;}
  .pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;}
  .chip{display:inline-block;font-size:12px;font-weight:500;padding:5px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--border);color:var(--ink);}
  .cst-supplier-box{display:flex;flex-wrap:wrap;gap:3px;align-items:center;min-height:20px;}
  .supplier-tag{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:1px 4px 1px 2px;font-size:11.5px;white-space:nowrap;color:var(--ink);}
  .supplier-tag .tag-avatar{width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;flex-shrink:0;}
  .supplier-tag .tag-remove{border:none;background:none;cursor:pointer;color:var(--muted);font-size:13px;line-height:1;padding:0 1px;}
  .supplier-tag .tag-remove:hover{color:var(--ink);}
  .cst-supplier-input{border:none;outline:none;background:transparent;font:inherit;flex:1;min-width:50px;padding:2px 2px;color:var(--ink);}
  .row-color-dot{width:16px;height:16px;border-radius:50%;border:none;padding:0;cursor:pointer;flex-shrink:0;}
  .row-color-trigger{width:15px;height:15px;border-radius:50%;border:1.5px dashed var(--border);background:transparent;padding:0;cursor:pointer;}
  .row-color-trigger:hover{border-color:var(--muted);}
  .pill-active{background:var(--accent-soft);color:var(--accent-dark);}
  .pill-inactive{background:#F0F0EE;color:var(--muted);}
  .pill-open{background:var(--clay-soft);color:var(--clay);}
  .pill-assigned{background:#E3EEF7;color:#2E6698;}
  .pill-progress{background:var(--s-dispatch-soft);color:var(--s-dispatch);}
  .pill-resolved{background:var(--accent-soft);color:var(--accent-dark);}
  .pill-closed{background:#F0F0EE;color:var(--muted);}
  .pill-low{background:#E4F8EA;color:#2E7D46;}
  .pill-medium{background:#FDF3D8;color:#A67C00;}
  .pill-high{background:#FCEEEB;color:#C15B4E;}
  .status-clock-hand{transform-origin:12px 12px;animation:clock-tick 2.4s linear infinite;}
  @keyframes clock-tick{to{transform:rotate(360deg);}}
  .row-actions{display:flex;gap:6px;}
  .empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
  .list-row{display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;flex-wrap:wrap;}
  .list-row:last-child{border-bottom:none;}

  .list-row .lr-avatar{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:10.5px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .list-row .lr-avatar.empty{background:var(--border);color:var(--muted);}

  /* ---------------- Kanban (Orders) ---------------- */
  .board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:14px;align-items:start;}
  @media (max-width:1150px){.board{grid-auto-flow:column;grid-auto-columns:78%;overflow-x:auto;padding-bottom:8px;}}
  .board-section{margin-bottom:32px;}
  .board-section-title{font-size:20px;font-weight:600;font-family:'Fraunces',serif;color:var(--ink);margin-bottom:14px;}
  .column{background:#fff;border:1px solid var(--border);border-radius:var(--radius);min-height:120px;display:flex;flex-direction:column;}
  .column-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;border-top-left-radius:var(--radius);border-top-right-radius:var(--radius);}
  .column-head .name{font-weight:600;font-size:13.5px;}
  .column-head .count{font-size:12px;font-weight:600;background:rgba(255,255,255,.6);padding:2px 8px;border-radius:999px;}

  .empty-col{color:var(--muted);font-size:12.5px;text-align:center;padding:18px 6px;border:1px dashed var(--border);border-radius:8px;}

  .card .customer{font-weight:600;font-size:13.5px;}
  .card .order-id{font-size:11px;color:var(--muted);}
  .card .product{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .card .meta-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}

  /* ---------------- Overlay / Modal ---------------- */
  @keyframes overlay-fade{from{opacity:0;}to{opacity:1;}}
  @keyframes modal-pop{from{opacity:0;transform:scale(.94) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}
  /* state.modal stays the same string across every re-render while a drawer/modal is open — typing,
     a dropdown change, a background save, all call render(). Without this, the whole panel gets
     torn down and rebuilt each time and its entrance animation replays, looking like it pops up
     again on every edit. .reopen-noanim wraps the panel on any re-render that isn't a fresh open. */
  .reopen-noanim .overlay, .reopen-noanim .modal, .reopen-noanim .drawer, .reopen-noanim .drawer-overlay,
  .reopen-noanim .admin-broadcast-overlay, .reopen-noanim .admin-broadcast-panel{ animation: none !important; }
  .overlay{position:fixed;inset:0;background:rgba(20,25,20,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;overflow-y:auto;animation:overlay-fade .18s ease;}
  .modal{background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.6);border-radius:16px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:24px;margin:auto;box-shadow:0 20px 60px rgba(20,40,25,.18),inset 0 1px 0 rgba(255,255,255,.7);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);animation:modal-pop .22s cubic-bezier(.16,.84,.44,1);}
  .admin-broadcast-overlay{position:fixed;inset:0;background:rgba(15,30,20,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:600;padding:20px;animation:toast-in .2s ease;}
  .admin-broadcast-panel{background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.6);border-radius:18px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:30px;box-shadow:0 30px 70px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.7);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);animation:modal-pop .28s cubic-bezier(.16,.84,.44,1);}
  .admin-broadcast-header{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
  .admin-broadcast-icon{font-size:28px;flex-shrink:0;}
  .admin-broadcast-title{font-size:19px;font-weight:700;color:var(--accent-dark);}
  .admin-broadcast-time{font-size:12px;color:var(--muted);margin-top:2px;}
  .admin-broadcast-body{font-size:15.5px;line-height:1.6;white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:16px 18px;margin-bottom:20px;}
  .admin-broadcast-reply-input{width:100%;resize:vertical;margin-bottom:14px;}
  .admin-broadcast-actions{display:flex;justify-content:flex-end;gap:10px;}
  .modal h2{margin:0 0 4px;font-size:19px;font-family:'Fraunces',serif;font-weight:600;}
  .modal .sub{color:var(--muted);font-size:12.5px;margin-bottom:18px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--ink);}
  .field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:7px;background:var(--bg);}
  .field input[type="checkbox"]{width:auto;padding:0;border:none;background:transparent;}
  .password-field-wrap{position:relative;}
  .password-field-wrap input{padding-right:38px;}
  .password-toggle-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:auto;background:none;border:none;padding:6px 8px;cursor:pointer;font-size:16px;line-height:1;color:var(--muted);}
  .password-toggle-btn:hover{color:var(--ink);}
  .field textarea{resize:vertical;min-height:60px;}
  .field textarea.task-area{min-height:100px;font-size:15px;line-height:1.5;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .ac-dropdown{position:absolute;top:100%;left:0;right:0;margin-top:4px;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 18px rgba(20,25,20,.12);max-height:220px;overflow-y:auto;z-index:40;}
  .ac-dropdown .ac-item{padding:9px 12px;font-size:13.5px;color:var(--ink);cursor:pointer;}
  .ac-dropdown .ac-item:hover,.ac-dropdown .ac-item.active{background:var(--bg);}
  .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-bottom:16px;}
  .photo-thumb{padding:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;aspect-ratio:1;cursor:pointer;background:var(--bg);}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-lightbox{position:fixed;inset:0;z-index:500;background:rgba(10,12,10,.88);display:none;align-items:center;justify-content:center;padding:32px;}
  .photo-lightbox.open{display:flex;animation:overlay-fade .2s ease;}
  .photo-lightbox img{max-width:100%;max-height:100%;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:modal-pop .25s cubic-bezier(.16,.84,.44,1);}
  .photo-lightbox-close{position:fixed;top:18px;right:22px;background:rgba(255,255,255,.12);color:#fff;border:none;width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer;}
  .photo-dropzone{border:1.5px dashed var(--border-strong);border-radius:10px;padding:14px;cursor:pointer;transition:border-color .15s,background .15s;}
  .photo-dropzone:hover,.photo-dropzone.drag-over{border-color:var(--accent);background:var(--accent-soft);}
  .photo-dropzone-empty{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;padding:16px 0;text-align:center;}
  .photo-dropzone-empty .icon{font-size:24px;}
  .photo-dropzone-preview{display:flex;align-items:center;gap:14px;}
  .photo-dropzone-preview img{max-width:110px;max-height:110px;border-radius:8px;object-fit:cover;border:1px solid var(--border);flex-shrink:0;}
  .photo-dropzone-preview-actions{display:flex;flex-direction:column;gap:2px;align-items:flex-start;}
  .photo-lightbox-close:hover{background:rgba(255,255,255,.22);}
  .richtext{border:1px solid var(--border);border-radius:7px;overflow:hidden;background:var(--bg);}
  .richtext-toolbar{display:flex;flex-wrap:wrap;gap:2px;padding:5px 6px;border-bottom:1px solid var(--border);background:#fff;}
  .richtext-toolbar button{border:none;background:transparent;border-radius:5px;width:28px;height:28px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .richtext-toolbar button:hover{background:var(--accent-soft, var(--border));}
  .richtext-toolbar button.active{background:var(--accent);color:#fff;}
  .richtext-toolbar .rt-sep{width:1px;background:var(--border);margin:3px 4px;}
  .richtext-body{min-height:100px;padding:9px 10px;font-size:15px;line-height:1.5;outline:none;}
  .richtext-body:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  .richtext-body ul,.richtext-body ol{padding-left:22px;margin:4px 0;}
  .richtext-body blockquote{margin:6px 0;padding:2px 0 2px 10px;border-left:3px solid var(--border);color:var(--muted);}
  .richtext-body a{color:var(--accent-dark);}
  .richtext-body:empty::before{content:attr(data-placeholder);color:var(--muted);}
  .modal-actions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end;flex-wrap:wrap;}
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
  .role-grid-3{grid-template-columns:1fr 1fr 1fr;}
  .role-grid-4{grid-template-columns:1fr 1fr;}
  .role-opt{border:1.5px solid var(--border);border-radius:9px;padding:14px 10px;text-align:center;background:#fff;font-weight:600;font-size:13.5px;}
  .role-opt.selected{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-dark);}
  .theme-swatch-btn{display:flex;align-items:center;gap:8px;border:1.5px solid var(--border);border-radius:9px;padding:10px 14px;background:#fff;font-weight:600;font-size:13px;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s;}
  .theme-swatch-btn:hover{border-color:var(--accent);}
  .theme-swatch-btn.selected{border-color:var(--accent);background:var(--accent-soft);}
  .theme-swatch-dot{width:16px;height:16px;border-radius:50%;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);}

  /* ---------------- Login screen ---------------- */
  .login-screen{min-height:100vh;display:flex;align-items:stretch;background:#fff;}
  .login-illustration{flex:1.1;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--accent-soft) 0%,color-mix(in srgb,var(--accent-soft) 55%,var(--accent) 45%) 55%,var(--accent-soft) 100%);padding:40px;min-width:0;overflow:hidden;position:relative;}
  .login-illustration-logo{width:100%;max-width:300px;height:auto;display:block;position:relative;z-index:1;filter:drop-shadow(0 8px 24px color-mix(in srgb,var(--accent-dark) 35%,transparent));}
  .login-panel{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 32px;position:relative;overflow:hidden;}
  .login-panel-inner{width:100%;max-width:380px;margin-top:-72px;position:relative;z-index:1;}
  .login-blob{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none;z-index:0;}
  .login-illustration .login-blob-1{width:300px;height:300px;background:var(--accent);opacity:.5;top:-80px;left:-40px;animation:blob-drift-1 24s ease-in-out infinite alternate;}
  .login-illustration .login-blob-2{width:260px;height:260px;background:var(--accent-dark);opacity:.4;bottom:-40px;right:5%;animation:blob-drift-2 28s ease-in-out infinite alternate;}
  .login-illustration .login-blob-3{width:220px;height:220px;background:var(--accent-dark);opacity:.28;top:50%;left:30%;animation:blob-drift-3 22s ease-in-out infinite alternate;}
  .login-panel .login-blob-1{width:240px;height:240px;background:var(--accent-soft);opacity:.6;top:-50px;right:-60px;animation:blob-drift-2 26s ease-in-out infinite alternate;}
  .login-panel .login-blob-2{width:200px;height:200px;background:var(--accent);opacity:.18;bottom:-40px;left:-50px;animation:blob-drift-1 30s ease-in-out infinite alternate;}
  .login-panel .login-blob-3{width:160px;height:160px;background:var(--accent-dark);opacity:.14;top:45%;right:8%;animation:blob-drift-3 22s ease-in-out infinite alternate;}
  @keyframes blob-drift-1{from{transform:translate(0,0) scale(1);}to{transform:translate(36px,44px) scale(1.15);}}
  @keyframes blob-drift-2{from{transform:translate(0,0) scale(1);}to{transform:translate(-34px,-38px) scale(1.1);}}
  @keyframes blob-drift-3{from{transform:translate(0,0) scale(1);}to{transform:translate(-40px,26px) scale(1.2);}}
  .login-clock{text-align:center;margin:0 0 36px;}
  .login-clock-time{font-family:'Fraunces',serif;font-weight:600;font-size:52px;line-height:1;color:#111;font-variant-numeric:tabular-nums;}
  .login-clock-date{margin-top:6px;color:var(--muted);font-size:13px;letter-spacing:.02em;}
  .login-title{font-family:'Fraunces',serif;font-weight:600;font-size:30px;color:var(--accent-dark);text-align:center;margin:0;}
  .login-panel .lead{text-align:center;color:var(--muted);font-size:13.5px;margin:4px 0 22px;}
  .login-submit{width:100%;padding:11px 14px;font-size:14px;margin-top:4px;}
  .login-mobile-logo{display:none;}
  @media (max-width:880px){
    .login-illustration{display:none;}
    .login-panel{padding:32px 20px;}
    .login-mobile-logo{display:block;height:40px;width:auto;margin:0 auto 18px;}
  }
  .stage-badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;}
  .timeline{margin:14px 0;position:relative;padding-left:28px;display:flex;flex-direction:column;gap:12px;}
  .timeline:before{content:'';position:absolute;left:7px;top:16px;bottom:16px;width:2px;background:var(--border);}
  .timeline .item{font-size:13px;position:relative;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 13px;line-height:1.45;box-shadow:0 2px 6px rgba(20,25,20,.05);}
  .timeline .item:before{content:'';position:absolute;left:-24.5px;top:15px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--surface);}
  .timeline .item .t{color:var(--muted);font-size:11px;margin-top:4px;}
  .citypak-live-track{position:relative;height:52px;margin:2px 0 8px;}
  .citypak-live-track .cpl-line{position:absolute;left:6%;right:6%;top:37px;height:3px;background:var(--border);border-radius:99px;}
  .citypak-live-track .cpl-dot{position:absolute;top:33px;width:9px;height:9px;border-radius:50%;background:var(--border);}
  .citypak-live-track .cpl-dot.start{left:calc(6% - 4.5px);}
  .citypak-live-track .cpl-dot.end{left:calc(94% - 4.5px);background:var(--accent);}
  .citypak-live-track .cpl-truck{position:absolute;top:19px;left:6%;width:30px;height:20px;margin-left:-15px;color:var(--accent);animation:citypak-truck-drive 4s cubic-bezier(.45,0,.4,1) infinite, citypak-truck-fade 4s linear infinite;}
  .citypak-live-track .cpl-truck svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 3px rgba(20,25,20,.22));animation:citypak-truck-bob .42s ease-in-out infinite;}
  @keyframes citypak-truck-drive{
    0%{left:6%;}
    90%,100%{left:88%;}
  }
  @keyframes citypak-truck-fade{
    0%{opacity:0;}
    6%{opacity:1;}
    86%{opacity:1;}
    92%{opacity:0;}
    100%{opacity:0;}
  }
  @keyframes citypak-truck-bob{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-1.2px);}
  }

  /* ---------------- Recipes / batch timer ---------------- */
  .recipe-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:8px;}
  .recipe-card .rc-title{font-weight:600;font-size:14.5px;}
  .recipe-card .rc-meta{font-size:12px;color:var(--muted);}
  .recipe-card.clickable-card:hover{background:var(--accent-soft);border-color:var(--accent);}
  .rc-icon-badge{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;margin-bottom:2px;}
  .rc-icon-badge svg{width:19px;height:19px;}
  .recipe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
  .batch-card{background:linear-gradient(160deg,#173A2B,#1F4B39);color:#fff;border-radius:14px;padding:26px 28px;margin-bottom:22px;}
  .batch-card .batch-recipe-name{font-size:13px;opacity:.75;text-transform:uppercase;letter-spacing:.04em;}
  .batch-card .batch-step-title{font-size:22px;font-weight:600;margin:4px 0 2px;font-family:'Fraunces',serif;}
  .batch-card .batch-step-amount{font-size:14.5px;opacity:.9;}
  .batch-countdown{font-size:56px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;margin:18px 0 6px;letter-spacing:.01em;}
  .batch-countdown.done{color:#FFD27A;animation:pulse-dot-lite 1.4s infinite;}
  @keyframes pulse-dot-lite{0%,100%{opacity:1;}50%{opacity:.55;}}
  .batch-progress-track{height:6px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;margin:14px 0 18px;}
  .batch-progress-fill{height:100%;background:#7CD98A;border-radius:99px;transition:width .4s ease;}
  .batch-controls{display:flex;gap:8px;flex-wrap:wrap;}
  .batch-controls .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff;}
  .batch-controls .btn:hover{background:rgba(255,255,255,.22);}
  .batch-controls .btn-primary{background:#3FA968;border-color:#3FA968;}
  .batch-controls .btn-primary:hover{background:#369059;}
  .batch-steplist{display:flex;flex-direction:column;gap:0;margin-top:18px;border-top:1px solid rgba(255,255,255,.16);}
  .batch-steplist .bs-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:13px;opacity:.55;}
  .batch-steplist .bs-row.current{opacity:1;font-weight:600;}
  .batch-steplist .bs-row.done{opacity:.75;}
  .batch-steplist .bs-num{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;}
  .batch-steplist .bs-row.done .bs-num{background:#3FA968;}
  .batch-steplist .bs-row.current .bs-num{background:#7CD98A;color:#173A2B;}
  .step-editor-row{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--bg);}
  .step-editor-row .se-num{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent-dark);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:6px;}
  .step-editor-row .se-fields{flex:1;display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;}
  .step-editor-row .se-actions{display:flex;flex-direction:column;gap:4px;}
  .step-editor-row .se-actions button{border:1px solid var(--border);background:#fff;border-radius:6px;width:26px;height:24px;font-size:11px;line-height:1;color:var(--muted);}
  .step-editor-row .se-actions button:hover{background:var(--bg);}

  .batch-focus{
    position:fixed;inset:0;z-index:400;background:linear-gradient(160deg,#0F2A20,#173A2B);
    color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px 24px;
  }
  .batch-focus-close{position:absolute;top:22px;right:26px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:8px 14px;font-size:14px;}
  .batch-focus-close:hover{background:rgba(255,255,255,.22);}
  .batch-focus .bf-recipe{font-size:18px;opacity:.7;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
  .batch-focus .bf-step-of{font-size:16px;opacity:.6;margin-bottom:18px;}
  .batch-focus .bf-ingredient{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(38px,7vw,88px);line-height:1.1;max-width:1000px;}
  .batch-focus .bf-amount{font-size:clamp(20px,3vw,34px);opacity:.9;margin-top:10px;}
  .batch-focus .bf-countdown{font-size:clamp(70px,14vw,180px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1;margin:34px 0 8px;}
  .batch-focus .bf-countdown.done{color:#FFD27A;animation:pulse-dot-lite 1.4s infinite;}
  .batch-focus .bf-note{font-size:18px;opacity:.8;margin-bottom:26px;}
  .batch-focus .bf-controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .batch-focus .bf-controls .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff;font-size:15px;padding:11px 20px;}
  .batch-focus .bf-controls .btn:hover{background:rgba(255,255,255,.22);}
  .batch-focus .bf-controls .btn-primary{background:#3FA968;border-color:#3FA968;}
  .batch-focus .bf-controls .btn-primary:hover{background:#369059;}
  .hint{font-size:11.5px;color:var(--muted);margin-top:4px;}

  .drawer-overlay{position:fixed;inset:0;background:rgba(20,25,20,.3);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:110;animation:overlay-fade .2s ease;}
  .drawer{
    position:fixed;top:0;right:0;bottom:0;width:760px;max-width:94vw;
    background:rgba(255,255,255,.8);border-left:1px solid rgba(255,255,255,.6);
    box-shadow:-16px 0 50px rgba(20,40,25,.16),inset 1px 0 0 rgba(255,255,255,.7);
    backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
    z-index:120;overflow-y:auto;padding:28px 34px;
    animation:drawer-in .26s cubic-bezier(.2,.8,.3,1);
  }
  .drawer .field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  @media (max-width:760px){ .drawer{width:100vw;padding:22px;} .drawer .field-row-3{grid-template-columns:1fr;} }
  .drawer-hero{
    background:var(--accent-grad);color:#fff;
    margin:-28px -34px 20px;padding:20px 34px 22px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .drawer-hero .back{display:inline-flex;align-items:center;gap:6px;color:rgba(255,255,255,.9);font-size:12.5px;font-weight:500;background:none;border:none;cursor:pointer;padding:0;margin-bottom:8px;}
  .drawer-hero h2{color:#fff;margin:0 0 3px;}
  .drawer-hero .sub{color:rgba(255,255,255,.85);margin:0;}
  .drawer-hero .stat-chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:8px 16px;text-align:center;flex-shrink:0;}
  .drawer-hero .stat-chip .k{font-size:10.5px;color:rgba(255,255,255,.85);text-transform:uppercase;letter-spacing:.02em;}
  .drawer-hero .stat-chip .v{font-size:16px;font-weight:700;margin-top:2px;}
  @media (max-width:760px){ .drawer-hero{margin:-22px -22px 20px;padding:18px 22px 20px;} }
  @keyframes drawer-in{from{transform:translateX(100%);}to{transform:translateX(0);}}
  .drawer-close{position:absolute;top:20px;right:20px;border:none;background:none;font-size:20px;color:var(--muted);cursor:pointer;line-height:1;}

  .welcome-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:linear-gradient(135deg,#F2F9F4,#E4F8EA);overflow:hidden;position:relative;}
  .welcome-logo{max-height:90px;max-width:220px;object-fit:contain;opacity:0;transform:scale(.85);animation:welcome-logo-in .55s ease forwards;}
  @keyframes welcome-logo-in{to{opacity:1;transform:scale(1);}}
  .welcome-line{width:0;height:4px;border-radius:4px;background:var(--accent-grad);animation:welcome-line-grow 1s ease forwards;box-shadow:0 0 16px rgba(76,175,109,.55);}
  .welcome-line-bottom{animation-delay:.1s;}
  @keyframes welcome-line-grow{0%{width:0;opacity:0;}20%{opacity:1;}100%{width:min(420px,70vw);opacity:1;}}
  .welcome-text{font-size:44px;font-weight:800;color:var(--accent-dark);letter-spacing:.5px;opacity:0;transform:translateY(14px);animation:welcome-text-in .6s ease .25s forwards;text-align:center;}
  @keyframes welcome-text-in{to{opacity:1;transform:translateY(0);}}
  @media (max-width:520px){ .welcome-text{font-size:30px;} }

  .center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{background:#fff;border-radius:14px;padding:32px;max-width:420px;width:100%;border:1px solid var(--border);}
  .login-card .wordmark{font-size:28px;color:var(--accent-dark);display:block;text-align:center;}
  .login-card .lead{text-align:center;color:var(--muted);font-size:13px;margin:4px 0 22px;}

  @media (max-width:880px){
    .sidebar{transform:translateX(-100%);}
    .sidebar.open{transform:translateX(0);}
    .main{margin-left:0;}
    .menu-toggle{display:inline-flex;}
    .sidebar-backdrop{display:block;position:fixed;inset:0;background:rgba(20,25,20,.35);z-index:39;animation:overlay-fade .18s ease;}
    .field-row{grid-template-columns:1fr;}
    main.page{padding:14px 14px 70px;}
    .topbar{padding:12px 14px;}
    .topbar .page-title{font-size:16px;}
    .stat-grid{grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:10px;margin-bottom:16px;}
    .stat-card{padding:12px 14px;}
    .stat-card .value{font-size:21px;}
    .panel{border-radius:12px;margin-bottom:14px;}
    .panel-head{padding:12px 14px;}
    .panel-body{padding:12px 14px;}
    table.data-table th, table.data-table td{padding:9px 10px;font-size:12.5px;}
    .toolbar{gap:8px;margin-bottom:12px;}
    .oi-row{flex-direction:column;align-items:stretch !important;gap:10px;}
    .oi-row-actions{grid-template-columns:1fr !important;width:100%;}
    .modal{padding:18px;border-radius:14px;}
    .drawer-hero .stat-chip{padding:7px 12px;}

  /* ---------------- Customer order tracker ---------------- */
  .track-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,var(--bg),#fff);}
  .track-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:30px 28px;max-width:480px;width:100%;box-shadow:0 12px 32px rgba(40,80,55,.08);}

/* =====================================================================
   BACKEND SETUP — read this once, then delete this comment block.

   This app now saves to a real Supabase database instead of Claude's
   temporary artifact storage — so refreshing, closing the tab, or
   opening it from a different computer all see the same live data.

   1. Go to https://supabase.com → New project (free tier is enough).
   2. Once it's created, open the SQL Editor and run:

        create table app_data (
          key text primary key,
          value jsonb not null default '[]'::jsonb,
          updated_at timestamptz not null default now()
        );
        alter table app_data enable row level security;
        create policy "anon full access" on app_data
          for all using (true) with check (true);
        alter publication supabase_realtime add table app_data;

      Note: that policy lets anyone with your anon key read/write this
      table directly (bypassing the app's login screen) if they inspect
      the page source. Fine for an internal team tool; if this ever
      needs to be public-facing, tighten the policy and add Supabase Auth.

   2b. For complaint photo uploads, also create a Storage bucket — run
      this in the same SQL Editor:

        insert into storage.buckets (id, name, public)
          values ('complaint-photos', 'complaint-photos', true);
        create policy "anon full access to complaint photos"
          on storage.objects for all
          using (bucket_id = 'complaint-photos')

      Same tradeoff as above — anyone with the anon key can read/write
      this bucket directly. Uses Supabase's separate 1GB free file
      storage, not the 500MB database quota.

   2c. For the "Add a picture" field on orders, create one more bucket:

        insert into storage.buckets (id, name, public)
          values ('order-photos', 'order-photos', true);
        create policy "anon full access to order photos"
          on storage.objects for all
          using (bucket_id = 'order-photos')
          with check (bucket_id = 'order-photos');

   3. In Project Settings → API, copy the "Project URL" and the
      "anon public" key, and paste them below.
   4. Host the .html file anywhere (Netlify, Vercel, GitHub Pages, or
      even a shared folder) — it talks straight to Supabase from the
      browser, no server needed.
   ===================================================================== */
const SUPABASE_URL = 'https://mntnobzwbvqpvmaxqcuc.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_pY4NxO1s9lbTWzz72OvWqg_0Pzk8FhC';
const BACKEND_CONFIGURED = !SUPABASE_URL.includes('PASTE_') && !SUPABASE_ANON_KEY.includes('PASTE_');
const supabaseClient = BACKEND_CONFIGURED ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const SYNCED_KEYS = ['orders','staff','customers','suppliers','complaints','chat','templates','recipes','activeBatch','gmpChecklistEntries','blendBatches','branding','navOrder','deliveryLines','staffCategories','theme','smsTemplates','orderSettings','smsCampaigns','complaintCategories','complaintPriorities','bulkSmsTemplates','navLabels','costingProducts','activityLog'];

async function kvGet(key){
  const { data, error } = await supabaseClient.from('app_data').select('value').eq('key', key).maybeSingle();
  if(error){ console.error('kvGet '+key, error); return null; }
  return data ? data.value : null;
}
// Timestamp of the last time WE wrote each key, so the realtime handler can recognize its own
// echo coming back even in the rare case the content-equality check below misses it (e.g. a
// save() retry re-sends the same value with a new updated_at, or some other subtle mismatch) —
// see the "recentlySavedByUs" guard where this is read.
let _recentSaveAt = {};
async function kvSet(key, value){
  _recentSaveAt[key] = Date.now();
  const { error } = await supabaseClient.from('app_data').upsert({ key, value, updated_at: new Date().toISOString() });
  if(error){ console.error('kvSet '+key, error); return false; }
  return true;
}
// Every SYNCED_KEY is stored as one row holding its whole array/object — so a plain save()
// overwrites the entire thing. If this tab's copy went stale (a dropped realtime connection, a
// long-idle background tab, etc.) and someone else saved a change to a DIFFERENT record in the
// meantime, a blind overwrite here would silently erase their change — e.g. an order someone
// else just moved to "Picked Up by Delivery" reverting back to "Processing" the next time this
// tab saves anything order-related. _syncBaseline holds this tab's last known-in-sync copy of
// each key (from initial load, our own successful saves, and incoming realtime updates); on save
// we diff our local copy against that baseline to see which records WE actually changed, then
// merge just those onto the freshest server copy — so a concurrent edit to some other record
// survives instead of being clobbered wholesale.
let _syncBaseline = {};
function snapshotBaseline(key){
  _syncBaseline[key] = Array.isArray(state[key]) ? JSON.parse(JSON.stringify(state[key])) : state[key];
}
function isMergeableRecordArray(arr){
  return Array.isArray(arr) && arr.length>0 && arr.every(r=>r && typeof r==='object' && 'id' in r);
}
// Shared by mergeBeforeSave (local-vs-freshly-fetched-server) and the realtime handler
// (local-vs-incoming-broadcast) — same diff-and-merge rule either way: a server/incoming record
// wins unless this tab has a genuinely different local copy (vs our last-known-synced baseline),
// in which case the local copy wins; a record only in baseline+local-missing is a local deletion
// (respected, not resurrected); a record only in local+not-in-baseline is a local creation (kept).
function reconcileRecordArray(key, serverArr){
  const local = state[key];
  if(!isMergeableRecordArray(local) || !Array.isArray(serverArr)) return serverArr;
  const baseline = _syncBaseline[key];
  if(!Array.isArray(baseline)) return serverArr; // no baseline yet to diff against
  const baselineById = new Map(baseline.map(r=>[r.id, r]));
  const localById = new Map(local.map(r=>[r.id, r]));
  const merged = [];
  const seen = new Set();
  serverArr.forEach(serverRec=>{
    seen.add(serverRec.id);
    const localRec = localById.get(serverRec.id);
    const baseRec = baselineById.get(serverRec.id);
    if(!localRec){
      // We don't have this record locally. If our baseline didn't have it either, it's new on
      // the server (someone else created it) — keep it. If our baseline DID have it, we deleted
      // it locally — respect that deletion rather than resurrecting the server's copy.
      if(!baseRec) merged.push(serverRec);
      return;
    }
    const localChanged = JSON.stringify(localRec) !== JSON.stringify(baseRec);
    merged.push(localChanged ? localRec : serverRec);
  });
  local.forEach(localRec=>{
    if(seen.has(localRec.id)) return;
    if(!baselineById.has(localRec.id)) merged.push(localRec); // created locally, not seen before
    // else: existed in our baseline but the server no longer has it — someone else deleted it
    // remotely; don't resurrect it.
  });
  return merged;
}
async function mergeBeforeSave(key){
  const local = state[key];
  if(!isMergeableRecordArray(local)) return local;
  if(!Array.isArray(_syncBaseline[key])) return local; // no baseline yet to diff against — save as-is
  let serverArr;
  try{ serverArr = await kvGet(key); }catch(e){ return local; }
  if(!Array.isArray(serverArr)) return local;
  return reconcileRecordArray(key, serverArr);
}
/* Sends an SMS via the send-sms Edge Function (which holds the real send.lk API key).
   Returns {ok:true} or {ok:false, error}. Never throws. */
async function sendSms(recipient, message){
  if(!SMS_CONFIGURED) return { ok:false, error:'SMS is not set up yet (see SMS_APP_SECRET in the code).' };
  if(!recipient) return { ok:false, error:'No phone number on this order.' };
  try{
    const res = await fetch(SUPABASE_URL + '/functions/v1/send-sms', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'x-sms-secret': SMS_APP_SECRET
      },
      body: JSON.stringify({ recipient, message })
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok || !data.ok){
      const base = (data && data.error) || ('SMS gateway error ('+res.status+')');
      const detail = data && data.detail ? ' — ' + JSON.stringify(data.detail).slice(0,200) : '';
      return { ok:false, error: base + detail };
    }
    return { ok:true };
  }catch(e){
    return { ok:false, error: 'Could not reach the SMS service.' };
  }
}
function orderTrackLink(id){
  return location.origin + location.pathname + '#track/' + encodeURIComponent(id);
}
/* Fetches live delivery tracking for a CityPak tracking number via the track-citypak Edge
   Function (which holds the real CityPak API key — customers' browsers never see it).
   Returns {ok:true, data} or {ok:false, error}. Never throws. */
async function fetchCitypakTracking(trackingNumber){
  if(!CITYPAK_CONFIGURED) return { ok:false, error:'Live tracking is not set up yet.' };
  if(!trackingNumber) return { ok:false, error:'No CityPak tracking number on this order.' };
  try{
    const res = await fetch(SUPABASE_URL + '/functions/v1/track-citypak?tracking_number=' + encodeURIComponent(trackingNumber), {
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'x-citypak-secret': CITYPAK_APP_SECRET
      }
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok || !data.ok){
      const base = (data && data.error) || ('CityPak tracking error ('+res.status+')');
      return { ok:false, error: base };
    }
    return { ok:true, data: data.data };
  }catch(e){
    return { ok:false, error: 'Could not reach the tracking service.' };
  }
}
// Fetches and caches a CityPak tracking number's live status, then re-renders the public
// track page to show it. Safe to call on every render — it only fetches once per tracking
// number unless force=true (used to silently poll for new events without flashing "Loading…").
async function ensureCitypakTracking(trackingNumber, force){
  if(!state._citypakTracking) state._citypakTracking = {};
  const existing = state._citypakTracking[trackingNumber];
  if(existing && !force) return;
  if(!existing) state._citypakTracking[trackingNumber] = {loading:true};
  const result = await fetchCitypakTracking(trackingNumber);
  state._citypakTracking[trackingNumber] = result;
  if(state.trackMode) render();
}
function renderCitypakTrackingBlock(trackingNumber){
  const fallbackLink = `<div style="text-align:center;margin-top:10px;"><a href="${CITYPAK_TRACK_URL}" target="_blank" rel="noopener" class="btn btn-sm" style="text-decoration:none;display:inline-block;">Track with CityPak →</a></div>`;
  if(!CITYPAK_CONFIGURED) return fallbackLink;
  const cached = state._citypakTracking && state._citypakTracking[trackingNumber];
  if(!cached || cached.loading){
    return `<div class="hint" style="text-align:center;margin-top:14px;">Loading delivery tracking…</div>`;
  }
  if(!cached.ok){
    return `<div style="text-align:center;margin-top:10px;">
      <div class="hint" style="color:var(--danger);margin-bottom:8px;">${esc(cached.error||'Could not load delivery tracking right now.')}</div>
      ${fallbackLink}
    </div>`;
  }
  const d = cached.data || {};
  const history = (d.tracking_history||[]).slice().reverse();
  if(!history.length) return fallbackLink;
  const liveTrack = d.is_delivered ? '' : `
    <div class="citypak-live-track">
      <div class="cpl-line"></div>
      <div class="cpl-dot start"></div>
      <div class="cpl-dot end"></div>
      <div class="cpl-truck"><svg viewBox="0 0 30 20" fill="currentColor">
        <path d="M1 5h14a1.5 1.5 0 0 1 1.5 1.5V15H2.5A1.5 1.5 0 0 1 1 13.5z"/>
        <path d="M16.5 9h5l3.5 3.6V15h-8.5z"/>
        <circle cx="7" cy="16" r="3.1"/>
        <circle cx="22" cy="16" r="3.1"/>
        <circle cx="7" cy="16" r="1" fill="var(--surface)"/>
        <circle cx="22" cy="16" r="1" fill="var(--surface)"/>
      </svg></div>
    </div>`;
  return `
  <div class="field" style="margin-top:18px;">
    <label style="text-align:center;display:block;">Delivery tracking${d.is_delivered ? ' — delivered' : ''}</label>
    ${liveTrack}
    <div class="timeline">
      ${history.map(h=>`<div class="item">${esc(h.status_type||'')}${h.location?' · '+esc(h.location):''}${h.description?' — '+esc(h.description):''}<div class="t">${esc(h.date||'')} ${esc(h.time||'')}</div></div>`).join('')}
    </div>
  </div>`;
}
async function sendBulkSms(){
  if(!isAdmin() || !SMS_CONFIGURED) return;
  const nameEl = document.getElementById('bulksms-campaign-name');
  const msgEl = document.getElementById('bulksms-message');
  const message = ((msgEl && msgEl.value) || '').trim();
  if(!message){ showToast('Enter a message before sending'); return; }
  const recipients = [...new Set([...state.bulkSmsCustomers].map(id=>{ const c = byId(state.customers, id); return c && c.phone; }).filter(Boolean))];
  if(!recipients.length){ showToast('Select at least one recipient'); return; }
  if(!confirm('Send this message to ' + recipients.length + ' recipient' + (recipients.length===1?'':'s') + '? This cannot be undone.')) return;

  const btn = document.getElementById('btn-send-bulk-sms'); if(btn) btn.disabled = true;
  const progressEl = document.getElementById('bulksms-progress');
  let sent = 0, failed = 0;
  let idx = 0;
  async function worker(){
    while(idx < recipients.length){
      const my = idx++;
      const result = await sendSms(recipients[my], message);
      if(result.ok) sent++; else failed++;
      if(progressEl) progressEl.textContent = 'Sending… ' + (sent+failed) + ' of ' + recipients.length + ' (' + sent + ' sent, ' + failed + ' failed)';
    }
  }
  await Promise.all(Array.from({length: Math.min(3, recipients.length)}, worker));

  if(!Array.isArray(state.smsCampaigns)) state.smsCampaigns = [];
  state.smsCampaigns.unshift({
    id: uid('CAMP'),
    name: ((nameEl && nameEl.value) || '').trim(),
    message,
    recipientCount: recipients.length,
    sentCount: sent,
    failedCount: failed,
    at: new Date().toISOString(),
    by: state.session.name
  });
  await save('smsCampaigns');
  state.bulkSmsCustomers.clear();
  render();
  showToast('Campaign sent — ' + sent + ' of ' + recipients.length + ' delivered' + (failed ? (', ' + failed + ' failed') : ''), 8000);
}
async function sendQuickSms(){
  if(!SMS_CONFIGURED) return;
  const recipientEl = document.getElementById('quicksms-recipient');
  const msgEl = document.getElementById('quicksms-message');
  const recipient = (recipientEl.value||'').trim();
  const message = (msgEl.value||'').trim();
  if(!recipient){ showToast('Enter a recipient phone number'); return; }
  if(!message){ showToast('Enter a message before sending'); return; }
  const btn = document.getElementById('btn-send-quick-sms');
  if(btn) btn.disabled = true;
  const result = await sendSms(recipient, message);
  if(btn) btn.disabled = false;
  if(result.ok){
    recipientEl.value = '';
    msgEl.value = '';
    msgEl.dispatchEvent(new Event('input'));
    showToast('Message sent');
  } else {
    showToast('Not sent: ' + result.error, 8000);
  }
}
function openBulkSmsTemplatesManager(){ state._bulkSmsTemplateForm = null; openModal('bulksmstemplates'); }
function startNewBulkSmsTemplate(){ state._bulkSmsTemplateForm = {id:null, name:'', message:''}; render(); }
function startEditBulkSmsTemplate(id){
  const t = byId(state.bulkSmsTemplates, id); if(!t) return;
  state._bulkSmsTemplateForm = {id: t.id, name: t.name, message: t.message};

}
function cancelBulkSmsTemplateForm(){ state._bulkSmsTemplateForm = null; render(); }
async function saveBulkSmsTemplateForm(e){
  e.preventDefault();
  const f = e.target;
  const name = (f.name.value||'').trim();
  const message = (f.message.value||'').trim();
  if(!name || !message) return;
  if(!Array.isArray(state.bulkSmsTemplates)) state.bulkSmsTemplates = [];
  const form = state._bulkSmsTemplateForm;
  if(form.id){
    const t = byId(state.bulkSmsTemplates, form.id);
    if(t){ t.name = name; t.message = message; }
  } else {
    state.bulkSmsTemplates.push({id: uid('SMSTPL'), name, message});
  }
  state._bulkSmsTemplateForm = null;
  await save('bulkSmsTemplates');
  render();
  showToast('Template saved');
}
async function deleteBulkSmsTemplate(id){
  const t = byId(state.bulkSmsTemplates, id); if(!t) return;
  if(!confirm(`Delete template "${t.name}"? This cannot be undone.`)) return;
  state.bulkSmsTemplates = state.bulkSmsTemplates.filter(x=>x.id!==id);
  await save('bulkSmsTemplates');
  render();
}

  complaintOpen: {label:'Complaint received (Open)', placeholders:['customer','trackLink']},
  complaintResolved: {label:'Complaint resolved', placeholders:['customer','trackLink','reviewLink']}
};
const DEFAULT_SMS_TEMPLATES = {
  orderProcessing: 'Hi {customer}, your Audrey Care order {orderNumber} is now processing! Track it: {trackLink}',
  orderPickedUp: "Hi {customer}, your Audrey Care order {orderNumber} has been picked up by delivery! Track it: {trackLink}. We'd love your feedback — please write a review here: {reviewLink}",
  trackingUpdated: 'Hi {customer}, the delivery tracking for your Audrey Care order {orderNumber} was just updated. Track it: {trackLink}',
  orderReviewFacebook: "Hi {customer}, thank you for choosing Audrey Care! We'd love your feedback — please write us a Facebook review here: {reviewLink}",
  orderReviewGoogle: "Hi {customer}, thank you for choosing Audrey Care! We'd love your feedback — please write us a Google review here: {reviewLink}",
  complaintOpen: "Hi {customer}, we've received your complaint. Track it here: {trackLink}",
  complaintResolved: "Hi {customer}, your complaint has been resolved! Track it here: {trackLink}. We'd love your feedback — please write a review here: {reviewLink}"
};
function smsTemplate(key){ return (state.smsTemplates && state.smsTemplates[key]) || DEFAULT_SMS_TEMPLATES[key]; }
function fillTemplate(str, vars){ return str.replace(/\{(\w+)\}/g, (m,k)=> (k in vars) ? vars[k] : m); }
async function sendOrderTrackingSms(o){
  const msg = fillTemplate(smsTemplate('orderPickedUp'), {customer:o.customer, orderNumber:o.orderNumber||o.id, trackLink:orderTrackLink(o.id), reviewLink:FACEBOOK_REVIEW_LINK});
  const result = await sendSms(o.phone, msg);
  if(result.ok){ o.smsSentAt = new Date().toISOString(); await save('orders'); showToast('SMS sent to customer'); }
  else{ showToast('SMS not sent: ' + result.error, 8000); }
  return result;
}
async function sendOrderProcessingSms(o){
  const msg = fillTemplate(smsTemplate('orderProcessing'), {customer:o.customer, orderNumber:o.orderNumber||o.id, trackLink:orderTrackLink(o.id)});
  const result = await sendSms(o.phone, msg);
  if(!result.ok) showToast('SMS not sent: ' + result.error, 8000);
  return result;
}
async function sendOrderTrackingUpdatedSms(o){
  const msg = fillTemplate(smsTemplate('trackingUpdated'), {customer:o.customer, orderNumber:o.orderNumber||o.id, trackLink:orderTrackLink(o.id)});
  const result = await sendSms(o.phone, msg);
  if(result.ok){ o.smsSentAt = new Date().toISOString(); await save('orders'); showToast('SMS sent to customer'); }
  else{ showToast('SMS not sent: ' + result.error, 8000); }
  return result;
}
const COMPLAINT_SMS_TEMPLATE_KEYS = {'Open':'complaintOpen', 'Resolved':'complaintResolved'};
async function sendComplaintStatusSms(c){
  if(!SMS_CONFIGURED) return;
  const key = COMPLAINT_SMS_TEMPLATE_KEYS[c.status];
  if(!key) return;
  if(!c.phone){ showToast('No contact number on file — SMS not sent'); return; }
  const msg = fillTemplate(smsTemplate(key), {customer:c.customer, trackLink:complaintTrackLink(c.id), reviewLink:FACEBOOK_REVIEW_LINK});
  const result = await sendSms(c.phone, msg);
  if(result.ok) showToast('SMS sent to customer');
  else showToast('SMS not sent: ' + result.error, 8000);
}
// "Send FB review link" / "Send Google review" buttons on the Order inquiry page.
// Once sent, the button for that platform freezes for Customer Care (can't resend); Admin can
// still click it again any time — the sentAt flag only gates non-admins in renderOrderInquiryPage.
async function sendOrderReviewSms(orderId, platform){
  const o = byId(state.orders, orderId); if(!o) return;
  const sentField = platform==='google' ? 'reviewSentGoogleAt' : 'reviewSentFbAt';
  if(!isAdmin() && o[sentField]){ showToast('Already sent — only Admin can send it again.'); return; }
  if(!SMS_CONFIGURED){ showToast('SMS is not set up yet.'); return; }
  if(!o.phone){ showToast('No contact number on file — SMS not sent'); return; }
  if(platform==='google' && !GOOGLE_REVIEW_CONFIGURED){ showToast("Google review link isn't set up yet — add GOOGLE_REVIEW_LINK in the code."); return; }
  const key = platform==='google' ? 'orderReviewGoogle' : 'orderReviewFacebook';
  const link = platform==='google' ? GOOGLE_REVIEW_LINK : FACEBOOK_REVIEW_LINK;
  const label = platform==='google' ? 'Google' : 'Facebook';
  const msg = fillTemplate(smsTemplate(key), {customer:o.customer, orderNumber:o.orderNumber||o.id, reviewLink:link});
  const result = await sendSms(o.phone, msg);
  if(result.ok){
    o[sentField] = new Date().toISOString();
    await save('orders');
    showToast(label+' review link sent to '+o.customer);
  } else showToast('SMS not sent: ' + result.error, 8000);
}
// Deep-equal via a key-sorted JSON representation. Postgres JSONB does not preserve object key
// order the way JS objects do, so a value we just wrote can round-trip through Supabase's
// realtime feed with its keys reordered — a plain JSON.stringify comparison would then wrongly
// treat our own echoed write as a "different" incoming change.
function stableStringify(v){
  if(Array.isArray(v)) return '['+v.map(stableStringify).join(',')+']';
  if(v && typeof v==='object') return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+stableStringify(v[k])).join(',')+'}';
  return JSON.stringify(v);
}
let realtimeChannel = null;
function subscribeRealtime(){
  if(realtimeChannel || !BACKEND_CONFIGURED) return;
  realtimeChannel = supabaseClient.channel('app_data_changes')
    .on('postgres_changes', {event:'*', schema:'public', table:'app_data'}, payload => {
      const row = payload.new || payload.old;
      if(!row || !row.key) return;
      const k = row.key;
      // Supabase echoes our own writes back through this same subscription. Re-rendering on an
      // echo that didn't actually change anything tears down and rebuilds the whole shell for no
      // reason — most visibly, it restarts the toast's pop-in animation and every panel's
      // entrance animation, making everything look like it popped up twice. Skip the no-op case
      // via a content check, backed up by a short time-based cooldown for the rare case a save()
      // retry (same value, new updated_at) or some other subtle round-trip mismatch slips past
      // the content check — still applies (and renders) any value that genuinely differs.
      const recentlySavedByUs = (key)=> (Date.now() - (_recentSaveAt[key]||0)) < 2500;
      if(k==='auth'){
        const incoming = payload.new ? payload.new.value : null;
        if(stableStringify(state.auth)===stableStringify(incoming) || recentlySavedByUs(k)) return;
        state.auth = incoming; render(); return;
      }
      if(SYNCED_KEYS.includes(k)){
        const incoming = payload.new ? payload.new.value : (k==='activeBatch' ? null : (k==='branding' ? {addons:[]} : (k==='navOrder' ? {} : (k==='navLabels' ? {} : (k==='theme' ? {paletteId:'green'} : (k==='smsTemplates' ? {...DEFAULT_SMS_TEMPLATES} : (k==='orderSettings' ? {...DEFAULT_ORDER_SETTINGS} : [])))))));
        if(stableStringify(state[k])===stableStringify(incoming) || recentlySavedByUs(k)) return;
        const prevChatLen = (k==='chat' && Array.isArray(state.chat)) ? state.chat.length : null;
        const prevComplaintsById = (k==='complaints' && Array.isArray(state.complaints)) ? new Map(state.complaints.map(c=>[c.id,c])) : null;
        // Don't blindly replace local state with this broadcast — if we have a record (e.g. an
        // order) that's brand new or locally edited and not yet saved, a wholesale overwrite here
        // would silently erase it the instant any unrelated realtime update for this key arrives.
        // reconcileRecordArray no-ops back to a plain overwrite for non-array/non-record keys.
        state[k] = reconcileRecordArray(k, incoming);
        snapshotBaseline(k);
        if(k==='theme') applyTheme();
        if(k==='branding') applyFavicon();
        // 'chat' and 'complaints' have follow-up effects right below that depend on the DOM
        // already reflecting this update (scroll-to-bottom, notice popups) — those always render
        // immediately. Everything else can be deferred while the user is mid-keystroke elsewhere.
        if(k==='chat' || k==='complaints') render(); else renderOrDefer();
        if(k==='chat'){
          if(state.page==='chat') scrollChatToBottom();
          if(prevChatLen!==null && state.chat.length>prevChatLen){
            const last = state.chat[state.chat.length-1];
            if(last && state.session && last.sender!==state.session.name){
              if(last.role==='Admin' && state.session.role==='Packing'){
                showAdminBroadcast(last);
              } else if(state.page!=='chat'){
                showChatNotice(last.sender, last.text);
              }
            }
          }
        }
        if(k==='complaints' && prevComplaintsById){
          if(isAdmin() || isSubAdmin()){
            const justOpened = state.complaints.filter(c=>c.status==='Open' && !prevComplaintsById.has(c.id));
            if(justOpened.length) showComplaintNotice(justOpened[justOpened.length-1].customer);
          }
          const myName = state.session && (state.session.staffName || state.session.name);
          if(myName){
            const justAssignedToMe = state.complaints.find(c=>{
              const prev = prevComplaintsById.get(c.id);
              return c.assignedTo===myName && (!prev || prev.assignedTo!==myName);
            });
            if(justAssignedToMe) showComplaintNotice(justAssignedToMe.customer, 'assigned to you — take a look.');
          }
        }
        if(k==='activeBatch' && state.page==='recipes') startBatchTicker();
      }
    })
    .subscribe();
}

function currentPalette(){
  const id = (state.theme && state.theme.paletteId) || 'green';
  return THEME_PALETTES.find(p=>p.id===id) || THEME_PALETTES[0];
}
// The accent color drives the sidebar highlight, buttons, dashboard chart colors, and the
// "current"/"delivered" board stage colors — applied as CSS custom properties so a palette
// change shows up everywhere at once without a page reload.
function applyTheme(){
  const p = currentPalette();
  const root = document.documentElement.style;
  root.setProperty('--accent', p.accent);
  root.setProperty('--accent-dark', p.accentDark);
  root.setProperty('--accent-soft', p.accentSoft);
  root.setProperty('--accent-grad', p.accentGrad);
  // The "delivered"/"resolved" stage color is the brand's success color, so it rides along
  // with the palette too. The other stage colors (received/processing/invoicing, and blend's
  // mixing/qc) stay fixed on purpose — they're a status-at-a-glance code, not decoration.
  root.setProperty('--s-delivered', p.accentDark);
  root.setProperty('--s-delivered-soft', p.accentSoft);
}

// The orders board is split into one line per delivery service, in this order. Admin-editable
// via "Manage Lists" (state.deliveryLines); this is only the seed used the first time the app runs.
// A line's "key" is the value stored on orders (order.courierService) and never changes once

function ordersInLine(list, courierKey){ return list.filter(o => (o.courierService||'')===courierKey); }
// "Outside" a line means either no delivery method is set, or it's set to a line that's hidden
// from the board (still a selectable delivery method, just without its own board section) — those
// orders fall into the Unassigned section instead of disappearing.
function ordersOutsideLines(list){
  const keys = state.deliveryLines.filter(l=>!l.hidden).map(l=>l.key);
  return list.filter(o => !keys.includes(o.courierService||''));
}
const ORDER_ARCHIVE_AFTER_MS = 2*60*60*1000; // completed orders auto-archive 2 hours after pickup
function activeOrders(){ return state.orders.filter(o=>!o.archived); }
function archivedOrders(){ return state.orders.filter(o=>o.archived).sort((a,b)=>new Date(b.archivedAt||b.completedAt||0)-new Date(a.archivedAt||a.completedAt||0)); }
function sweepCompletedOrders(){
  const lastStage = STAGES.length-1;
  const now = Date.now();
  let changed = false;
  state.orders.forEach(o=>{
    if(o.stage!==lastStage || o.archived) return;
    const completedMs = o.completedAt ? new Date(o.completedAt).getTime() : NaN;
    if(!o.completedAt || isNaN(completedMs)){
      // Missing or unparseable completedAt (completed before archiving existed, or a malformed
      // timestamp from old data) — archive it now rather than leaving it stuck forever, since
      // `now - NaN` is always NaN and would never clear the >= check below.
      o.archived = true; o.archivedAt = new Date().toISOString(); changed = true; return;
    }
    if(now - completedMs >= ORDER_ARCHIVE_AFTER_MS){
      o.archived = true; o.archivedAt = new Date().toISOString(); changed = true;
    }
  });
  return changed;
}
