// Resizes/re-encodes an image file to a JPEG blob before upload, to keep Supabase Storage usage
// down — phone-camera photos are often 2-5MB, this typically gets them under ~300KB with little
// visible quality loss. Falls back to the original file untouched if anything goes wrong (a
// non-image file, a decode failure, an older browser) so a failed compression never blocks the
// actual upload.
function compressImage(file, maxDim, quality){
  return new Promise((resolve)=>{
    if(!file || !file.type || !file.type.startsWith('image/')){ resolve(file); return; }
    try{
      const reader = new FileReader();
      reader.onload = (e)=>{
        const img = new Image();
        img.onload = ()=>{
          let { width, height } = img;
          if(width > maxDim || height > maxDim){
            if(width > height){ height = Math.round(height * maxDim / width); width = maxDim; }
            else { width = Math.round(width * maxDim / height); height = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          canvas.toBlob((blob)=>{ resolve(blob || file); }, 'image/jpeg', quality);
        };
        img.onerror = ()=> resolve(file);
        img.src = e.target.result;
      };
      reader.onerror = ()=> resolve(file);
      reader.readAsDataURL(file);
    }catch(e){ resolve(file); }
  });
}

// Pulls the Storage object path back out of a Supabase public URL, so an expired photo can be
// deleted from Storage (not just unlinked from the order/complaint record).
function storagePathFromUrl(url, bucket){
  if(!url) return null;
  const marker = `/object/public/${bucket}/`;
  const idx = url.indexOf(marker);
  if(idx===-1) return null;
  try{ return decodeURIComponent(url.slice(idx + marker.length)); }catch(e){ return url.slice(idx + marker.length); }
}
function isPhotoExpired(uploadedAt){
  if(!uploadedAt) return false;
  return (Date.now() - new Date(uploadedAt).getTime()) > PHOTO_EXPIRY_DAYS*24*60*60*1000;
}
// Complaint photo entries are {url, uploadedAt} going forward, but complaints saved before this
// feature existed still have plain URL strings — both are handled everywhere c.photos is read.
function complaintPhotoUrl(p){ return typeof p==='string' ? p : p.url; }

// Deletes any order/complaint photo uploaded more than PHOTO_EXPIRY_DAYS ago, both from Storage
// and from the record referencing it. Legacy complaint photos (plain strings, no uploadedAt) are
// left alone since we don't know their real age. Returns which collections changed, so the
// caller knows what to save.
async function sweepExpiredPhotos(){
  if(!BACKEND_CONFIGURED) return {orders:false, complaints:false};
  let ordersChanged = false, complaintsChanged = false;
  for(const o of state.orders){
    if(o.photo && isPhotoExpired(o.photoUploadedAt)){
      const path = storagePathFromUrl(o.photo, ORDER_PHOTOS_BUCKET);
      if(path){ try{ await supabaseClient.storage.from(ORDER_PHOTOS_BUCKET).remove([path]); }catch(e){ console.error('expired order photo delete failed', e); } }
      o.photo = null; o.photoUploadedAt = null; ordersChanged = true;
    }
  }
  for(const c of state.complaints){
    if(!Array.isArray(c.photos) || !c.photos.length) continue;
    const keep = [];
    for(const p of c.photos){
      if(typeof p!=='string' && isPhotoExpired(p.uploadedAt)){
        const path = storagePathFromUrl(p.url, COMPLAINT_PHOTOS_BUCKET);
        if(path){ try{ await supabaseClient.storage.from(COMPLAINT_PHOTOS_BUCKET).remove([path]); }catch(e){ console.error('expired complaint photo delete failed', e); } }
        complaintsChanged = true;
      } else keep.push(p);
    }
    if(keep.length!==c.photos.length) c.photos = keep;
  }
  return {orders:ordersChanged, complaints:complaintsChanged};
}

// Uploads up to `limit` files to the complaint-photos Storage bucket (see BACKEND SETUP at the
// top of the file) and returns the public URLs that succeeded. Failures are logged and skipped
// rather than blocking the rest of the save — a photo that didn't upload shouldn't lose the
// complaint update itself.
async function uploadComplaintPhotos(complaintId, fileList, limit){
  if(!BACKEND_CONFIGURED || !fileList || !fileList.length || limit<=0) return [];
  const files = [...fileList].slice(0, limit);
  const entries = [];
  for(const file of files){
    const compressed = await compressImage(file, 1600, 0.72);
    const path = `${complaintId}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
    const { error } = await supabaseClient.storage.from(COMPLAINT_PHOTOS_BUCKET).upload(path, compressed, {contentType:'image/jpeg'});
    if(error){ console.error('complaint photo upload failed', error); continue; }
    const { data } = supabaseClient.storage.from(COMPLAINT_PHOTOS_BUCKET).getPublicUrl(path);
    if(data && data.publicUrl) entries.push({url: data.publicUrl, uploadedAt: new Date().toISOString()});
  }
  return entries;
}
const ORDER_PHOTOS_BUCKET = 'order-photos';
// Single-photo upload for the order "Add a picture" field — one image per order, not a gallery.
// Returns {url, error} rather than throwing/swallowing — callers show `error` in the toast so a
// missing Storage bucket (the most common cause) is obvious instead of a silent/generic failure.
async function uploadOrderPhoto(orderId, file){
  if(!BACKEND_CONFIGURED) return {url:null, error:'Backend not configured'};
  if(!file) return {url:null, error:'No file given'};
  const compressed = await compressImage(file, 1600, 0.72);
  const path = `${orderId}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
  const { error } = await supabaseClient.storage.from(ORDER_PHOTOS_BUCKET).upload(path, compressed, {contentType:'image/jpeg'});
  if(error){ console.error('order photo upload failed', error); return {url:null, error: error.message || 'Upload failed'}; }
  const { data } = supabaseClient.storage.from(ORDER_PHOTOS_BUCKET).getPublicUrl(path);
  if(!data || !data.publicUrl) return {url:null, error:'No public URL returned'};
  return {url: data.publicUrl, error:null};
}

function wirePhotoDropzone(prefix){
  const zone = document.getElementById(prefix+'-dropzone');
  if(!zone) return;
  const input = document.getElementById(prefix+'-input');
  const emptyEl = document.getElementById(prefix+'-empty');
  const previewEl = document.getElementById(prefix+'-preview');
  const previewImg = document.getElementById(prefix+'-preview-img');
  const removeBtn = document.getElementById(prefix+'-remove');
  const viewBtn = document.getElementById(prefix+'-view');
  const removeFlag = document.getElementById(prefix+'-remove-flag');
  // The server-rendered markup already has the existing photo's URL as the preview <img>'s src —
  // View full size needs that URL too, not just one picked fresh via drag/paste/click.
  if(viewBtn && previewImg && previewImg.getAttribute('src')) viewBtn.dataset.photoUrl = previewImg.getAttribute('src');

  function showPreview(url){
    previewImg.src = url;
    if(viewBtn) viewBtn.dataset.photoUrl = url;
    emptyEl.style.display = 'none';
    previewEl.style.display = 'flex';
  }
  function setFile(file){
    if(!file || !file.type || !file.type.startsWith('image/')) return;
    if(input){ try{ const dt = new DataTransfer(); dt.items.add(file); input.files = dt.files; }catch(e){} }
    if(removeFlag) removeFlag.value = '0';
    showPreview(URL.createObjectURL(file));
  }
  if(input){
    zone.addEventListener('click', (e)=>{ if(e.target===removeBtn || e.target===viewBtn) return; input.click(); });
    zone.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); input.click(); } });
    zone.addEventListener('dragover', (e)=>{ e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', ()=>zone.classList.remove('drag-over'));
    zone.addEventListener('drop', (e)=>{
      e.preventDefault(); zone.classList.remove('drag-over');
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      if(file) setFile(file);
    });
    zone.addEventListener('paste', (e)=>{
      const items = e.clipboardData && e.clipboardData.items; if(!items) return;
      for(const item of items){
        if(item.type && item.type.startsWith('image/')){
          const file = item.getAsFile();
          if(file){ setFile(file); e.preventDefault(); }
          break;
        }
      }
    });
    input.addEventListener('change', ()=>{ const file = input.files && input.files[0]; if(file) setFile(file); });
  }
  if(removeBtn) removeBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    if(input) input.value = '';
    if(removeFlag) removeFlag.value = '1';
    previewImg.src = '';
    previewEl.style.display = 'none';
    emptyEl.style.display = 'flex';
  });
  if(viewBtn) viewBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    const url = viewBtn.dataset.photoUrl;
    if(!url) return;
    const lb = document.getElementById('photo-lightbox');
    if(lb){ document.getElementById('photo-lightbox-img').src = url; lb.classList.add('open'); }
  });
}

function blankGmpChecklistEntry(checklistId, year, month){
  const entry = {id:uid('GMPCHK'), checklistId, year, month, cells:{}, updatedAt:new Date().toISOString()};
  gmpChecklistExtraRows(gmpChecklistDefById(checklistId)).forEach(r=>{ entry[r.key] = {}; });

async function updateGmpChecklistCell(checklistId, year, month, taskCode, day){
  let entry = gmpChecklistEntryFor(checklistId, year, month);
  if(!entry){
    entry = blankGmpChecklistEntry(checklistId, year, month);
    state.gmpChecklistEntries = [...(state.gmpChecklistEntries||[]), entry];
  }
  const key = taskCode+'_'+day;
  const cur = entry.cells[key] || '';
  const idx = GMP_CHECKLIST_STATUS_CYCLE.indexOf(cur);
  const next = GMP_CHECKLIST_STATUS_CYCLE[(idx+1) % GMP_CHECKLIST_STATUS_CYCLE.length];
  if(next) entry.cells[key] = next; else delete entry.cells[key];
  entry.updatedAt = new Date().toISOString();
  await save('gmpChecklistEntries'); render();

}

async function loadAll(){
  if(!BACKEND_CONFIGURED){ state.loaded = true; state.backendMissing = true; render(); return; }
  const defaultFor = k => k==='activeBatch' ? null : (k==='branding' ? {addons:[]} : (k==='navOrder' ? {} : (k==='navLabels' ? {} : (k==='theme' ? {paletteId:'green'} : (k==='smsTemplates' ? {...DEFAULT_SMS_TEMPLATES} : (k==='orderSettings' ? {...DEFAULT_ORDER_SETTINGS} : []))))));
  const loadedValues = await Promise.all(SYNCED_KEYS.map(k => kvGet(k).catch(()=>null)));
  SYNCED_KEYS.forEach((k, i) => { state[k] = loadedValues[i] || defaultFor(k); });
  if(!state.branding || !Array.isArray(state.branding.addons)) state.branding = {addons: []};
  if(!state.navOrder || typeof state.navOrder !== 'object' || Array.isArray(state.navOrder)) state.navOrder = {};
  // Backfills any SMS template keys added after a workspace was first set up.
  state.smsTemplates = {...DEFAULT_SMS_TEMPLATES, ...(state.smsTemplates||{})};
  state.orderSettings = {...DEFAULT_ORDER_SETTINGS, ...(state.orderSettings||{})};
  if(!Array.isArray(state.deliveryLines) || state.deliveryLines.length===0){
    state.deliveryLines = JSON.parse(JSON.stringify(DEFAULT_DELIVERY_LINES));
    kvSet('deliveryLines', state.deliveryLines).catch(e=>console.error('seed deliveryLines failed', e));
  } else if(!state.deliveryLines.some(l=>l.key==='CustomerPickup')){
    state.deliveryLines = [...state.deliveryLines, {key:'CustomerPickup', label:'Customer Pickup', hidden:true}];
    kvSet('deliveryLines', state.deliveryLines).catch(e=>console.error('add CustomerPickup line failed', e));
  } else {
    // Customer Pickup was added as a visible board section before it was decided to keep it
    // out of the board by default — hide it for anyone who already has it from that rollout.
    const existing = state.deliveryLines.find(l=>l.key==='CustomerPickup');
    if(existing && existing.hidden===undefined){
      existing.hidden = true;
      kvSet('deliveryLines', state.deliveryLines).catch(e=>console.error('hide CustomerPickup line failed', e));
    }
  }
  if(!Array.isArray(state.staffCategories) || state.staffCategories.length===0){
    state.staffCategories = JSON.parse(JSON.stringify(DEFAULT_STAFF_CATEGORIES));
    kvSet('staffCategories', state.staffCategories).catch(e=>console.error('seed staffCategories failed', e));
  }
  if(!Array.isArray(state.complaintCategories) || state.complaintCategories.length===0){
    state.complaintCategories = [...DEFAULT_COMPLAINT_CATEGORIES];
    kvSet('complaintCategories', state.complaintCategories).catch(e=>console.error('seed complaintCategories failed', e));
  }
  if(!Array.isArray(state.complaintPriorities) || state.complaintPriorities.length===0){
    state.complaintPriorities = [...DEFAULT_COMPLAINT_PRIORITIES];
    kvSet('complaintPriorities', state.complaintPriorities).catch(e=>console.error('seed complaintPriorities failed', e));
  }
  if(!Array.isArray(state.recipes)) state.recipes = [];
  if(!state.recipes.some(r=>r.name==='Body Lotion - Hotel Range')){
    const mat = (name, percent) => ({id:uid('MAT'), name, percent});
    state.recipes.unshift({
      id: uid('RCP'), name: 'Body Lotion - Hotel Range', description: '',
      batchSizeKg: 150, standardPH: '5.5 - 6.5',
      combineNote: 'White Oil, Palm Oil, Stearic Acid, Cetyl Alcohol, Cetareth 20, GMS 40, BHT, EGDS',
      materials: [
        mat('DI water', 92.4), mat('Stearic Acid', 4), mat('Cetyl Alcohol', 0.4), mat('Cetareth 20', 0.5),
        mat('Refined Glycerin 99.5% USP', 0.2), mat('GMS 40', 1), mat('BHT (Butylated Hydroxy Toluene)', 0.1),
        mat('Di sodium EDTA', 0.1), mat('Phenoxyethanol', 0.5), mat('Fragrance', 0.5), mat('EGDS', 0.4),
        mat('White oil', 0.8), mat('Carbomer 940', 0.2), mat('KOH', 0.3), mat('P. Oil', 0.5), mat('Citric Acid', 0.1)
      ],
      steps: [
        {id:uid('STEP'), ingredient:'Carbomer + H2O', amount:'80kg', waitMinutes:0},
        {id:uid('STEP'), ingredient:'Water + EDTA + Glycerin', amount:'5kg', waitMinutes:0},
        {id:uid('STEP'), ingredient:'Oil pot — melt and combine the oil-phase materials', amount:'', waitMinutes:0},
        {id:uid('STEP'), ingredient:'Water + KOH', amount:'5kg', waitMinutes:0},
        {id:uid('STEP'), ingredient:'Citric Acid + H2O', amount:'500g', waitMinutes:0}
      ],
      createdAt: new Date().toISOString()
    });
    kvSet('recipes', state.recipes).catch(e=>console.error('seed Body Lotion recipe failed', e));
  }
  if(!Array.isArray(state.costingProducts)) state.costingProducts = [];
  if(state.costingProducts.length===0){
    const DEFAULT_COSTING_PRODUCTS = ['Shampoo', 'Shower Gel', 'Conditioner', 'Body Lotion', 'Hand Wash', 'Bubble Bath'];
    state.costingProducts = DEFAULT_COSTING_PRODUCTS.map(name => ({id:uid('CPROD'), name, versions:[]}));
    kvSet('costingProducts', state.costingProducts).catch(e=>console.error('seed costingProducts failed', e));
  }
  // Costing sheets used to store one flat {materials, batchSizes} per product — now each
  // product holds named, dated versions so past formulations stay on record. Wrap any still-flat
  // product into a single "Version 1", and migrate each raw material's old single `supplier`
  // string into the new `suppliers` array (up to two suppliers per material).
  {
    let migrated = false;
    state.costingProducts.forEach(p=>{
      if(!Array.isArray(p.versions)){
        const hasData = (p.materials && p.materials.length) || (p.batchSizes && p.batchSizes.length);
        p.versions = hasData ? [{
          id: uid('CVER'), name: 'Version 1',
          materials: p.materials || [], batchSizes: p.batchSizes || [],
          createdBy: '—', createdAt: p.createdAt || new Date().toISOString(),
          editedBy: '—', editedAt: new Date().toISOString(),
        }] : [];
        delete p.materials; delete p.batchSizes;
        migrated = true;
      }
      (p.versions||[]).forEach(v=>{
        (v.materials||[]).forEach(m=>{
          if(!Array.isArray(m.suppliers)){
            m.suppliers = m.supplier ? [m.supplier] : [];
            delete m.supplier;
            migrated = true;
          }
        });
      });
    });
    if(migrated) kvSet('costingProducts', state.costingProducts).catch(e=>console.error('migrate costingProducts failed', e));
  }
  if(!Array.isArray(state.staff)) state.staff = [];
  {
    const SEED_STAFF = [
      {name:'Vihanga', title:'Operation Assistant Manager', category:'operation'},
      {name:'Madhushanka', title:'Production Executive', category:'operation'},
      {name:'Chamalka', title:'Packing Trainee', category:'operation'},
      {name:'Naduni', title:'Packing Trainee', category:'operation'},
      {name:'Daham', title:'Blending Trainee', category:'operation'},
      {name:'Prabhath', title:'Customer Representative', category:'sales'},
      {name:'Vishmika', title:'Customer Representative', category:'sales'}
    ];
    const byName = {};
    state.staff.forEach(s=>{ byName[s.name.toLowerCase()] = s; });
    let staffChanged = false;
    SEED_STAFF.forEach(seed=>{
      const existing = byName[seed.name.toLowerCase()];
      if(!existing){
        state.staff.push({id:uid('STF'), ...seed});
        staffChanged = true;
      } else {
        // Backfill title/category only if blank — an earlier "+Add staff" entry (from before
        // categories existed) shouldn't get stuck with no title just because the name matched.
        if(!existing.title){ existing.title = seed.title; staffChanged = true; }
        if(!existing.category){ existing.category = seed.category; staffChanged = true; }
      }
    });
    if(staffChanged){
      kvSet('staff', state.staff).catch(e=>console.error('seed staff failed', e));
    }
  }
  try{ const s = localStorage.getItem('audrey_session'); state.session = s ? JSON.parse(s) : null; }
  catch(e){ state.session = null; }
  try{
    const a = await kvGet('auth');
    state.auth = a ? {...DEFAULT_AUTH, ...a} : {...DEFAULT_AUTH};
    await kvSet('auth', state.auth);
  }catch(e){ state.auth = {...DEFAULT_AUTH}; }
  state.loaded = true;
  applyTheme();
  applyFavicon();
  if(sweepCompletedOrders()) save('orders').catch(e=>console.error('archive sweep save failed', e));
  if(sweepClosedComplaints()) save('complaints').catch(e=>console.error('complaint archive sweep save failed', e));
  if(state.session){
    sweepExpiredPhotos().then(async (r)=>{
      if(r.orders) await save('orders');
      if(r.complaints) await save('complaints');
      if(r.orders || r.complaints) render();
    }).catch(e=>console.error('expired photo sweep failed', e));
  }
  if(state.trackMode && _trackRequestedId){
    const found = byId(state.orders, _trackRequestedId) ||
      state.orders.find(o=>(o.orderNumber||'').toLowerCase()===_trackRequestedId.toLowerCase());
    if(found){ state.trackedOrderId = found.id; }
    else { state.trackError = "We couldn't find an order with that link — check with the shop."; }
  }
  if(state.complaintMode && _complaintRequestedId){
    const found = byId(state.complaints, _complaintRequestedId);
    if(found){ state.publicComplaintId = found.id; }
    else { state.publicComplaintError = "We couldn't find a complaint with that link."; }
  }
  // Sidebar links carry their page as a URL hash (e.g. #orders) so right-click / ctrl-click /
  // middle-click "open in new tab" opens straight to that page instead of always landing on
  // the default one.
  if(state.session && !state.trackMode && !state.boardMode && !state.complaintMode){
    const hashPage = ((location.hash||'').replace('#','').split('/')[0]||'').toLowerCase();
    if(hashPage && pageAllowed(hashPage)) state.page = hashPage;
  }
  SYNCED_KEYS.forEach(k=>snapshotBaseline(k));
  render();
  subscribeRealtime();
  // Customer-facing tracking page: while a CityPak shipment is still in transit, silently
  // re-poll for new tracking events so the page updates live without needing a manual reload.
  // Stops itself once the shipment is marked delivered.
  if(state.trackMode) setInterval(pollCitypakTrackingIfActive, 30000);
  const runArchiveSweep = async ()=>{
    if(sweepCompletedOrders()){ await save('orders'); render(); }
    if(sweepClosedComplaints()){ await save('complaints'); render(); }
  };
  runArchiveSweep(); // don't wait for the first interval tick — catch anything already overdue right away
  setInterval(runArchiveSweep, 2*60*1000);
  // Photo cleanup doesn't need to be prompt like the order/complaint archive sweep above — once
  // every 30 minutes is plenty for deleting old attachments.
  setInterval(async ()=>{
    if(state.session){
      const r = await sweepExpiredPhotos().catch(e=>{ console.error('expired photo sweep failed', e); return {orders:false, complaints:false}; });
      if(r.orders) await save('orders');
      if(r.complaints) await save('complaints');
      if(r.orders || r.complaints) render();
    }
  }, 30*60*1000);
}
function pollCitypakTrackingIfActive(){
  const o = state.trackedOrderId ? byId(state.orders, state.trackedOrderId) : null;
  if(!o || o.courierService!=='CityPak' || !o.courierNumber || o.stage<3 || !CITYPAK_CONFIGURED) return;
  const cached = state._citypakTracking && state._citypakTracking[o.courierNumber];
  if(cached && cached.ok && cached.data && cached.data.is_delivered) return;
  ensureCitypakTracking(o.courierNumber, true);
}

// Two overlapping save() calls for the SAME key (e.g. the background archive sweep firing while
// a manual edit is mid-save) would each fetch-merge-write independently and could interleave —
// the later write's merge wouldn't yet know about the earlier write's change, discarding it. This
// queue makes same-key saves run one at a time so each one's merge always sees the previous one's
// result. Different keys still save fully in parallel.
let _saveQueues = {};
function save(key){
  const prior = _saveQueues[key] || Promise.resolve();
  const run = prior.then(()=>_saveOnce(key), ()=>_saveOnce(key));
  _saveQueues[key] = run;
  return run;
}
async function _saveOnce(key){
  // Two attempts: the second covers a transient/rate-limit error on the first.
  for(let attempt=0; attempt<2; attempt++){
    try{
      const merged = await mergeBeforeSave(key);
      const ok = await kvSet(key, merged);
      if(ok){ state[key] = merged; snapshotBaseline(key); return true; }
    }catch(e){}
    await new Promise(r=>setTimeout(r, 500));
  }
  console.error('save '+key+' failed');
  showToast('Could not save '+key+' — please try again');
  return false;
}

// A single admin-visible audit trail — who did what, and when. Call this alongside (never
// instead of) the real action; a logging failure must never block or roll back the action it's
// recording, so this never throws and the caller doesn't need to await it.
async function logActivity(message){
  try{
    if(!Array.isArray(state.activityLog)) state.activityLog = [];
    state.activityLog.unshift({
      id: uid('LOG'), at: new Date().toISOString(),
      actor: (state.session && (state.session.staffName || state.session.name)) || 'Unknown',
      role: state.session ? state.session.role : null,
      message,
    });
    // Keep a full year of history — trim only entries older than that, not by count, so an
    // active shop doesn't lose months of audit trail to an arbitrary entry cap.
    const oneYearAgo = Date.now() - 365*24*60*60*1000;
    state.activityLog = state.activityLog.filter(l => new Date(l.at).getTime() >= oneYearAgo);
    await save('activityLog');
  }catch(e){ console.error('logActivity failed', e); }
}

const TAG_COLORS = ['#7C5CFC','#D99A1F','#4CAF6D','#3B82C4','#E0615C','#C45CA0','#2FA8A0','#C4825C'];
function tagColorFor(name){
  let hash=0; for(let i=0;i<name.length;i++) hash = (hash*31+name.charCodeAt(i))|0;

function esc(str){ const d=document.createElement('div'); d.innerText = str==null?'':str; return d.innerHTML; }
// esc() round-trips through innerText/innerHTML, which turns real newlines into literal "<br>"
// tags — fine for one-line display text, but it corrupts multi-line content re-shown inside a
// <textarea> (each save/reopen cycle would bake in more "<br>" text). Use this instead whenever
// prefilling a <textarea>'s body from stored data, so newlines stay newlines.
function escBody(str){ return String(str==null?'':str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// Heals batches saved before the fix above, where a real newline already got baked into a
// literal "<br>" the first time the field round-tripped through esc().
function unbr(str){ return (str||'').replace(/<br\s*\/?>/gi, '\n'); }
function escAttr(str){ return String(str==null?'':str).replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }
function richText(html){ return html==null ? '' : html; }
function stripTags(html){ const d=document.createElement('div'); d.innerHTML = html||''; return (d.textContent||d.innerText||'').trim(); }
/* Rich text field: a contenteditable box with a small formatting toolbar, backed by a hidden
   input so it plugs into the existing form-read-by-name code (f.<name>.value) unchanged. */
function richTextField({name, label='', value='', placeholder='', required=false, readOnly=false}){
  return `
  <div class="field">
    ${label ? `<label>${esc(label)}${required?' *':''}</label>` : ''}
    <div class="richtext" data-richtext="${name}">
      ${readOnly ? '' : `
      <div class="richtext-toolbar">
        <button type="button" data-rt-cmd="bold" title="Bold"><b>B</b></button>
        <button type="button" data-rt-cmd="italic" title="Italic"><i>I</i></button>
        <button type="button" data-rt-cmd="underline" title="Underline"><u>U</u></button>
      </div>`}
      <div class="richtext-body task-area" ${readOnly?'':'contenteditable="true"'} ${required?'aria-required="true"':''} data-richtext-input="${name}" data-placeholder="${esc(placeholder)}">${richText(value)}</div>
    </div>
    <input type="hidden" name="${name}" value="${escAttr(value)}">
  </div>`;
}
function syncRichTextInputs(form){
  form.querySelectorAll('[data-richtext-input]').forEach(body=>{
    const input = form.elements[body.dataset.richtextInput];
    if(input) input.value = body.innerHTML;
  });
}
function bindRichTextFields(root){
  (root||document).querySelectorAll('[data-richtext]').forEach(wrap=>{
    const body = wrap.querySelector('[data-richtext-input]');
    const hidden = wrap.parentElement.querySelector('input[type="hidden"][name="'+wrap.dataset.richtext+'"]');
    if(!body || !hidden || body.dataset.rtBound) return;
    body.dataset.rtBound = '1';
    const sync = ()=>{ hidden.value = body.innerHTML; };
    body.addEventListener('input', sync);
    // Paste as plain text only — otherwise formatting pasted in from Word/Excel/a webpage (fonts,
    // background highlight colors, etc.) gets baked into the stored HTML and follows the text
    // around forever, including into anything later copied back out of this field.
    body.addEventListener('paste', e=>{
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData('text/plain');
      document.execCommand('insertText', false, text);
      sync();
    });
    wrap.querySelectorAll('[data-rt-cmd]').forEach(btn=>{
      btn.addEventListener('mousedown', e=>e.preventDefault());
      btn.addEventListener('click', ()=>{
        body.focus();
        const cmd = btn.dataset.rtCmd;
        let value = btn.dataset.rtValue || null;
        if(cmd==='createLink'){
          value = prompt('Link URL:', 'https://');
          if(!value) return;
        }
        document.execCommand(cmd, false, value);
        sync();
      });
    });
  });
}

/* ===================== Session ===================== */
// Named-login passwords are stored hashed (SHA-256 hex) so nobody — including Admin — can read
// a person's actual password back out of Settings; Admin can only remove a login and let them
// re-onboard with a fresh one. Plain-text comparison is kept only as a fallback for logins saved
// before hashing existed, and such an entry is silently upgraded to a hash the next time it's
// used to sign in successfully.
async function sha256Hex(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function looksHashed(v){ return typeof v==='string' && /^[0-9a-f]{64}$/.test(v); }
async function passwordMatches(input, stored){
  if(!stored) return false;
  if(looksHashed(stored)) return (await sha256Hex(input)) === stored;
  return input === stored;
}
function selectRole(role){

async function confirmLogin(){
  const passInput = document.getElementById('login-password');
  const errEl = document.getElementById('login-error');
  const password = (passInput.value||'');
  const role = state._pendingRole;
  const logins = state.auth.roleLogins && state.auth.roleLogins[role];
  let sessionName = role;
  if(logins && logins.length){
    const nameInput = document.getElementById('login-name');
    const typedName = (nameInput ? nameInput.value : '').trim();
    const match = logins.find(l=>l.name.toLowerCase()===typedName.toLowerCase());
    const ok = match && await passwordMatches(password, match.password);
    if(!ok){
      if(errEl) errEl.textContent = 'Incorrect name or password — try again.';
      passInput.value = ''; passInput.focus();
      return;
    }
    sessionName = match.name;
    if(!looksHashed(match.password)){
      match.password = await sha256Hex(password);
      kvSet('auth', state.auth).catch(e=>console.error('lazy password hash upgrade failed', e));
    }
  } else {
    const expected = role==='Admin' ? state.auth.adminPassword : (role==='Sub Admin' ? state.auth.subAdminPassword : (role==='Blending' ? state.auth.blendingPassword : (role==='Customer Care' ? state.auth.customerCarePassword : state.auth.packingPassword)));
    if(password !== expected){
      if(errEl) errEl.textContent = 'Incorrect password — try again.';
      passInput.value = ''; passInput.focus();
      return;
    }
  }
  state.session = {name: sessionName, role, staffName: sessionName!==role ? sessionName : null};
  state.page = (pagesForRole(role)||['dashboard'])[0] || 'dashboard';
  state._justLoggedIn = true;
  state.aiChat = [];
  clearInterval(state._loginClockTimer);
  await saveSession();
  logActivity(`Logged in (${role})`);
  render();
}

    address: f.address.value.trim(), product: f.product.value.trim(), qty:'',
    priority: f.priority.value, notes: f.notes.value.trim(),

    orderNumber: f.orderNumber.value.trim(), startDate: f.startDate.value || new Date().toISOString().slice(0,10), dueDate: f.dueDate.value || '',
    courierService: f.courierService.value,
    courierNumber: f.courierNumber.value.trim(),
    createdAt: new Date().toISOString(),
    history: [{stage:0, at:new Date().toISOString(), by:state.session.name}]
  };
  if(!order.orderNumber) order.orderNumber = order.id;

function orderAutoSmsKind(stage){

  return null;
}
// Either sends the automatic stage-change SMS right away (when "Send SMS automatically" is on),
// or opens a Yes/No confirmation popup first (when it's off) — see Settings → SMS settings.
function orderSmsSender(kind){
  if(kind==='pickedup') return sendOrderTrackingSms;
  if(kind==='trackingUpdated') return sendOrderTrackingUpdatedSms;
  return sendOrderProcessingSms;
}
async function triggerAutoOrderSms(o, kind){

async function archiveOrderNow(id){

async function advanceOrder(id){

  o.stage += 1; o.assignee = null;

  o.history.push({stage:o.stage, at:new Date().toISOString(), by:state.session.name});
  await save('orders');
  showToast(justCompleted ? 'Order picked up by delivery' : 'Moved to '+STAGES[o.stage]);

async function moveOrderToStage(id, newStage, newCourierService, orderedIds){
  const o = byId(state.orders, id); if(!o) return;
  const courierChanged = newCourierService!==undefined && (o.courierService||'')!==newCourierService;
  if(o.stage===newStage && !courierChanged){
    // Same column — this is a pure drag-to-reorder, not a stage change.
    if(orderedIds){ applyBoardOrder(orderedIds); await save('orders'); }
    return;
  }
  const oldStage = o.stage;
  o.stage = newStage;
  if(courierChanged) o.courierService = newCourierService;
  if(newStage===STAGES.length-1){ o.completedAt = new Date().toISOString(); }
  else { o.completedAt = null; o.archived = false; o.archivedAt = null; }
  o.history.push({stage:newStage, at:new Date().toISOString(), by:state.session.name});
  applyBoardOrder(orderedIds);
  await save('orders');
  showToast(courierChanged ? `Moved to ${STAGES[newStage]} — now ${newCourierService||'unassigned'} delivery` : 'Moved to '+STAGES[newStage]);
  // Only text the customer when the order actually progresses forward — a card dragged backwards
  // by accident shouldn't re-trigger a "your order is..." SMS.
  await triggerAutoOrderSms(o, newStage>oldStage ? orderAutoSmsKind(newStage) : null);
}

function initChecklistSignCanvas(){
  const canvas = document.getElementById('sign-pad-canvas');
  if(!canvas || canvas.dataset.signInit) return;
  canvas.dataset.signInit = '1';
  const ctx = canvas.getContext('2d');
  ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.strokeStyle = '#1a1a1a';
  if(canvas.dataset.existing){
    const img = new Image();
    img.onload = ()=>{ ctx.drawImage(img, 0, 0, canvas.width, canvas.height); canvas.dataset.hasDrawing = '1'; };
    img.src = canvas.dataset.existing;
  }
  let drawing = false;
  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: (p.clientX-rect.left) * (canvas.width/rect.width), y: (p.clientY-rect.top) * (canvas.height/rect.height) };
  }
  function start(e){ e.preventDefault(); drawing = true; const pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); }
  function move(e){ if(!drawing) return; e.preventDefault(); const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); canvas.dataset.hasDrawing = '1'; }
  function end(){ drawing = false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
}
function initCropModal(){
  const frame = document.getElementById('crop-frame');
  const img = document.getElementById('crop-img');
  const zoomSlider = document.getElementById('crop-zoom');
  if(!frame || !img || frame.dataset.cropInit) return;
  frame.dataset.cropInit = '1';
  const frameW = frame.clientWidth, frameH = frame.clientHeight;
  const cs = {zoom:1, x:0, y:0, baseScale:1, naturalW:0, naturalH:0, dragging:false, startX:0, startY:0, origX:0, origY:0};
  function applyTransform(){
    const scale = cs.baseScale * cs.zoom;
    img.style.width = (cs.naturalW*scale)+'px';
    img.style.height = (cs.naturalH*scale)+'px';
    img.style.transform = `translate(${cs.x}px, ${cs.y}px)`;
  }
  function clamp(){
    const scale = cs.baseScale*cs.zoom;
    const w = cs.naturalW*scale, h = cs.naturalH*scale;
    const minX = Math.min(0, frameW - w), maxX = 0;
    const minY = Math.min(0, frameH - h), maxY = 0;
    cs.x = Math.min(maxX, Math.max(minX, cs.x));
    cs.y = Math.min(maxY, Math.max(minY, cs.y));
  }
  function initSize(){
    cs.naturalW = img.naturalWidth; cs.naturalH = img.naturalHeight;
    if(!cs.naturalW || !cs.naturalH) return;
    cs.baseScale = Math.max(frameW/cs.naturalW, frameH/cs.naturalH);
    cs.zoom = 1;
    const w = cs.naturalW*cs.baseScale, h = cs.naturalH*cs.baseScale;
    cs.x = (frameW-w)/2; cs.y = (frameH-h)/2;
    applyTransform();
  }
  if(img.complete && img.naturalWidth) initSize();
  else img.addEventListener('load', initSize);

  function pointerDown(e){
    cs.dragging = true;
    const p = e.touches ? e.touches[0] : e;
    cs.startX = p.clientX; cs.startY = p.clientY;
    cs.origX = cs.x; cs.origY = cs.y;
    frame.style.cursor = 'grabbing';
  }
  function pointerMove(e){
    if(!cs.dragging) return;
    const p = e.touches ? e.touches[0] : e;
    cs.x = cs.origX + (p.clientX - cs.startX);
    cs.y = cs.origY + (p.clientY - cs.startY);
    clamp();
    applyTransform();
  }
  function pointerUp(){ cs.dragging = false; frame.style.cursor = 'grab'; }
  frame.addEventListener('mousedown', pointerDown);
  window.addEventListener('mousemove', pointerMove);
  window.addEventListener('mouseup', pointerUp);
  frame.addEventListener('touchstart', pointerDown, {passive:true});
  window.addEventListener('touchmove', pointerMove, {passive:true});
  window.addEventListener('touchend', pointerUp);

  if(zoomSlider){
    zoomSlider.addEventListener('input', ()=>{
      cs.zoom = Number(zoomSlider.value)/100;
      clamp();
      applyTransform();
    });
  }

  const saveBtn = document.getElementById('btn-save-crop');
  if(saveBtn){
    saveBtn.onclick = async ()=>{
      const outScale = 2;
      const canvas = document.createElement('canvas');
      canvas.width = frameW*outScale; canvas.height = frameH*outScale;
      const ctx = canvas.getContext('2d');
      const scale = cs.baseScale*cs.zoom;
      const sx = -cs.x/scale, sy = -cs.y/scale, sw = frameW/scale, sh = frameH/scale;
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/png');
      await finishBrandCrop(dataUrl);
    };
  }
}

// Parses CSV text into rows of cells, honoring quoted fields (with "" as an escaped quote).
function parseCsvText(text){
  const rows = []; let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(inQuotes){
      if(ch==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else { inQuotes=false; } }
      else field += ch;
    } else if(ch==='"'){ inQuotes = true; }
    else if(ch===','){ row.push(field); field=''; }
    else if(ch==='\n' || ch==='\r'){
      if(ch==='\r' && text[i+1]==='\n') i++;
      row.push(field); field='';
      if(row.length>1 || row[0]!=='') rows.push(row);
      row = [];
    } else field += ch;
  }
  if(field!=='' || row.length) { row.push(field); rows.push(row); }
  return rows;
}
// Some CSV exports (WordPress, some CRMs) HTML-encode punctuation, e.g. "Fisherman&#039;s Cove".
// Decode it back so the stored value reads normally.
function decodeHtmlEntities(str){
  const t = document.createElement('textarea');
  t.innerHTML = str || '';
  return t.value;
}
async function importCustomersCsv(file){
  const text = await file.text();
  const rows = parseCsvText(text).filter(r=>r.some(cell=>cell.trim()!==''));
  if(rows.length===0){ showToast('That file has no rows to import'); return; }
  const header = rows[0].map(h=>h.trim().toLowerCase());
  const findCol = names => header.findIndex(h=>names.includes(h));
  const nameIdx = findCol(['name','customer name','full name']);
  const phoneIdx = findCol(['phone','mobile','mobile number','phone number','contact','sms phone']);
  const addressIdx = findCol(['address','addr']);
  const cityIdx = findCol(['city','area','city/area']);
  const shortNameIdx = findCol(['short name','shortname']);
  const branchNameIdx = findCol(['branch name','branchname','branch']);
  const salesmanIdx = findCol(['salesman','sales man','sales person','salesperson']);
  const dataRows = nameIdx===-1 ? rows : rows.slice(1);
  const cols = nameIdx===-1
    ? {name:0, phone:1, address:2, city:-1, shortName:-1, branchName:-1, salesman:-1}
    : {name:nameIdx, phone:phoneIdx, address:addressIdx, city:cityIdx, shortName:shortNameIdx, branchName:branchNameIdx, salesman:salesmanIdx};
  const cell = (r, idx) => idx>-1 ? decodeHtmlEntities((r[idx]||'').trim()) : '';
  // Skip rows that match a customer already in the list, so re-importing the same file
  // (or an overlapping one) never creates duplicates. Matched by name or phone, whichever
  // is present — either one being the same customer is enough to count as a duplicate.
  const normName = s => String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
  const normPhone = s => String(s||'').replace(/\D/g,'');
  const existingNames = new Set(state.customers.map(c=>normName(c.name)));
  const existingPhones = new Set(state.customers.map(c=>normPhone(c.phone)).filter(Boolean));
  let added = 0, skipped = 0, duplicates = 0;
  dataRows.forEach(r=>{
    const name = cell(r, cols.name);
    if(!name){ skipped++; return; }
    const phone = cell(r, cols.phone);
    const nName = normName(name), nPhone = normPhone(phone);
    if(existingNames.has(nName) || (nPhone && existingPhones.has(nPhone))){
      duplicates++;
      return;
    }
    state.customers.unshift({
      id: uid('CUS'), name,
      shortName: cell(r, cols.shortName), branchName: cell(r, cols.branchName),
      phone, address: cell(r, cols.address), cityArea: cell(r, cols.city),
      salesman: cell(r, cols.salesman) || null,
      email:'', type:'Individual', status:'Active',
      createdAt: new Date().toISOString()
    });
    existingNames.add(nName);
    if(nPhone) existingPhones.add(nPhone);
    added++;
  });
  if(added>0) await save('customers');
  render();
  const notes = [];
  if(duplicates) notes.push(`skipped ${duplicates} already in your list`);
  if(skipped) notes.push(`skipped ${skipped} with no name`);
  showToast(`Imported ${added} customer${added===1?'':'s'}${notes.length?`, ${notes.join(', ')}`:''}`);
}

    const phone = cell(r, cols.phone);
    const vendorId = cell(r, cols.vendorId);
    const nName = normName(name), nPhone = normPhone(phone), nVendorId = normName(vendorId);
    if(existingNames.has(nName) || (nPhone && existingPhones.has(nPhone)) || (nVendorId && existingVendorIds.has(nVendorId))){
      duplicates++;
      return;
    }
    const status = cell(r, cols.status);
    state.suppliers.unshift({
      id: uid('SUP'), name, vendorId, contact: cell(r, cols.contact), phone,
      email: cell(r, cols.email), address: cell(r, cols.address),
      status: status==='Inactive' ? 'Inactive' : 'Active',
      createdAt: new Date().toISOString(),
    });
    existingNames.add(nName);
    if(nPhone) existingPhones.add(nPhone);
    if(nVendorId) existingVendorIds.add(nVendorId);
    added++;
  });
  if(added>0) await save('suppliers');
  render();
  const notes = [];
  if(duplicates) notes.push(`skipped ${duplicates} already in your list`);
  if(skipped) notes.push(`skipped ${skipped} with no name`);
  showToast(`Imported ${added} supplier${added===1?'':'s'}${notes.length?`, ${notes.join(', ')}`:''}`);
}

/* ===================== Complaints ===================== */
async function submitComplaint(e){
  e.preventDefault();
  const f = e.target; const editId = f.dataset.editId;
  const existing = editId ? byId(state.complaints, editId) : null;
  const data = {
    customer: f.customer.value.trim(), category: f.category.value,
    priority: f.priority.value, status: f.status.value,
    // The "Assigned representative" field isn't rendered for Customer Care (they can't reassign),
    // so a missing field means "leave it as-is", not "clear the assignment" — only fall back to ''
    // when there's no existing complaint to preserve it from (i.e. creating a new one).
    assignedTo: f.assignedTo ? (f.assignedTo.value || '') : (existing ? existing.assignedTo : ''),
    description: f.description.value.trim(), phone: f.phone.value.trim(), invoiceNumber: f.invoiceNumber.value.trim()
  };
  if(!data.customer) return;
  let complaint, statusChanged = false;
  if(editId){
    complaint = existing;
    if(!complaint) return;
    if(isComplaintLocked(complaint)){ showToast('This complaint can only be edited by Admin now'); closeModal(); return; }
    // Assigning someone to a still-Open complaint moves it to the Assigned tab automatically,
    // unless the person saving also explicitly moved status further along in the same save.
    if(!complaint.assignedTo && data.assignedTo && data.status==='Open') data.status = 'Assigned';
    statusChanged = complaint.status !== data.status;
    Object.assign(complaint, data);
    if(statusChanged){
      if(data.status==='Closed') complaint.closedAt = new Date().toISOString();
      else { complaint.closedAt = null; complaint.archived = false; complaint.archivedAt = null; }
    }
  } else {
    complaint = {id:uid('CMP'), ...data, photos:[], createdAt:new Date().toISOString()};
    state.complaints.unshift(complaint);
    statusChanged = true;
  }
  const photoInput = f.elements['photos'];
  if(photoInput && photoInput.files && photoInput.files.length){
    if(!Array.isArray(complaint.photos)) complaint.photos = [];
    const remaining = MAX_COMPLAINT_PHOTOS - complaint.photos.length;
    const uploaded = await uploadComplaintPhotos(complaint.id, photoInput.files, remaining);
    complaint.photos.push(...uploaded);
    if(uploaded.length < Math.min(photoInput.files.length, remaining)) showToast('Some images could not be uploaded', 6000);
  }
  await save('complaints'); closeModal();
  showToast(editId ? 'Complaint updated' : 'Complaint logged');
  if(statusChanged) sendComplaintStatusSms(complaint);
}
async function deleteComplaint(id){
  const c = byId(state.complaints, id);
  const allowed = c && c.archived ? isAdmin() : (isAdmin() || isSubAdmin());
  if(!allowed){ showToast(c && c.archived ? 'Only Admin can delete archived complaints' : 'Only Admin can delete complaints'); return; }
  if(!confirm('Delete this complaint?')) return;
  state.complaints = state.complaints.filter(c=>c.id!==id);
  await save('complaints');
  logActivity(`Deleted complaint${c&&c.customer?' from '+c.customer:''}${c&&c.headline?': '+c.headline:''}`);
  closeModal();
}
// Moves a Resolved/Closed complaint back to the active list. Once it's archived (2h+ after being
// closed), only Admin can restore it — Sub Admin can still restore from the regular tabs.
async function restoreComplaint(id){
  const c = byId(state.complaints, id);
  if(!c || (c.status!=='Resolved' && c.status!=='Closed')) return;
  const allowed = c.archived ? isAdmin() : (isAdmin() || isSubAdmin());
  if(!allowed) return;
  c.status = 'In Progress';
  c.closedAt = null; c.archived = false; c.archivedAt = null;
  await save('complaints');
  showToast('Complaint restored to the active list');
}
async function addComplaintUpdate(id){
  const c = byId(state.complaints, id);
  if(!c) return;
  if(isComplaintLocked(c)){ showToast('This complaint can only be edited by Admin now'); return; }
  const form = document.getElementById('form-complaint');
  const status = form.elements['customerUpdateStatus'].value.trim() || 'Not Updated';
  const note = form.elements['logUpdate'].value.trim();
  const photoInput = form.elements['photos'];
  const hasPhotos = !!(photoInput && photoInput.files && photoInput.files.length);
  if(!note && !hasPhotos){ showToast('Add a note or attach images before saving the update'); return; }
  if(!Array.isArray(c.updates)) c.updates = complaintUpdates(c);
  if(note) c.updates.push({status, note, at:new Date().toISOString(), by: state.session.name});
  if(hasPhotos){
    if(!Array.isArray(c.photos)) c.photos = [];
    const remaining = MAX_COMPLAINT_PHOTOS - c.photos.length;
    if(remaining<=0){ showToast(`Already at the ${MAX_COMPLAINT_PHOTOS}-image limit for this complaint`); }
    else {
      const uploaded = await uploadComplaintPhotos(c.id, photoInput.files, remaining);
      c.photos.push(...uploaded);
      if(uploaded.length < Math.min(photoInput.files.length, remaining)) showToast('Some images could not be uploaded', 6000);
    }
  }
  await save('complaints');
  showToast('Update added');
}

function startChatPolling(){ stopChatPolling(); state._chatTimer = setInterval(pollChat, 4000); }
function stopChatPolling(){ if(state._chatTimer){ clearInterval(state._chatTimer); state._chatTimer=null; } }
async function pollChat(){
  if(state.page !== 'chat') return;
  try{
    const messages = await kvGet('chat') || [];
    // Compare content, not just length — a like, edit, or quote on an existing message doesn't
    // change the array length, so a length-only check would miss it (realtime usually beats this
    // 4s poll to it anyway; this is just the fallback path).
    if(stableStringify(messages)!==stableStringify(state.chat)){
      const inputEl = document.getElementById('chat-input');
      const draft = inputEl ? inputEl.value : '';
      const wasFocused = document.activeElement === inputEl;
      state.chat = messages;
      render();
      const newInput = document.getElementById('chat-input');
      if(newInput){ newInput.value = draft; if(wasFocused) newInput.focus(); }
      scrollChatToBottom();
    }
  }catch(e){ /* silent — polling is best-effort */ }
}
function scrollChatToBottom(){
  const el = document.getElementById('chat-messages');
  if(el) el.scrollTop = el.scrollHeight;
}
function chatMyName(){ return state.session && (state.session.staffName || state.session.name); }
// render() tears down and rebuilds the whole page, which resets #chat-messages' scroll position
// to the top — very visible on a long thread. Liking, editing, quoting etc. shouldn't jerk the
// view around, so every chat action re-renders through this instead of calling render() directly.
function renderKeepChatScroll(){
  const el = document.getElementById('chat-messages');
  const scrollTop = el ? el.scrollTop : null;
  render();
  if(scrollTop!==null){
    const newEl = document.getElementById('chat-messages');
    if(newEl) newEl.scrollTop = scrollTop;
  }
}
function toggleChatMenu(id){ state.chatMenuOpenId = state.chatMenuOpenId===id ? null : id; renderKeepChatScroll(); }
function closeChatMenu(){ if(state.chatMenuOpenId){ state.chatMenuOpenId = null; renderKeepChatScroll(); } }
async function toggleChatLike(id){
  const m = state.chat.find(x=>x.id===id); if(!m) return;
  if(!Array.isArray(m.likes)) m.likes = [];
  const me = chatMyName();
  const i = m.likes.indexOf(me);
  if(i>-1) m.likes.splice(i,1); else m.likes.push(me);
  state.chatMenuOpenId = null;
  renderKeepChatScroll();
  await save('chat');
}
function startChatQuote(id){
  state.chatQuoteId = id; state.chatMenuOpenId = null; renderKeepChatScroll();
  const input = document.getElementById('chat-input'); if(input) input.focus();
}
function cancelChatQuote(){ state.chatQuoteId = null; renderKeepChatScroll(); }
async function copyChatMessage(id){
  const m = state.chat.find(x=>x.id===id); if(!m) return;
  state.chatMenuOpenId = null; renderKeepChatScroll();
  try{ await navigator.clipboard.writeText(m.text); showToast('Message copied'); }
  catch(e){ showToast('Copy failed'); }
}
function startChatEdit(id){
  const m = state.chat.find(x=>x.id===id); if(!m || m.sender!==chatMyName()) return;
  state.chatEditId = id; state.chatMenuOpenId = null; renderKeepChatScroll();

function cancelChatEdit(){ state.chatEditId = null; renderKeepChatScroll(); }
async function saveChatEdit(id){

  const input = document.getElementById('chat-edit-input');

function markChatUnread(){ state.chatUnread = true; state.chatMenuOpenId = null; renderKeepChatScroll(); showToast('Marked as unread'); }
async function sendChatMessage(e){
  e.preventDefault();

/* ===================== AI workspace assistant ===================== */
// A rule-based Q&A assistant that answers from the app's own in-memory data — no external
// API, no setup, works instantly. Recognizes a fixed set of common questions (orders,
// blending batches, complaints, revenue, customers, staff, deliveries); anything else gets
// a helpful fallback listing what it can do.
function qHas(q, ...words){ return words.some(w=>q.includes(w)); }

// Page names/aliases the assistant recognizes for "go to ___" style navigation commands.
const AI_NAV_PAGES = {
  dashboard: ['dashboard', 'home'],
  orders: ['orders board', 'order board', 'orders'],
  orderinquiry: ['order inquiry', 'order lookup'],
  blending: ['blending board', 'blending'],
  recipes: ['recipes', 'recipe'],
  customers: ['customers'],
  suppliers: ['suppliers'],
  complaints: ['complaints'],
  gmp: ['gmp', 'checklists', 'checklist'],
  staff: ['staff'],
  chat: ['team chat', 'chat'],
  bulksms: ['bulk sms', 'sms'],
  ratings: ['customer ratings', 'ratings'],
  settings: ['settings', 'setting'],
};
function findAiNavPage(q){
  for(const [pageId, names] of Object.entries(AI_NAV_PAGES)){
    if(names.some(n=>q.includes(n))) return pageId;
  }
  return null;
}

function answerAiQuery(raw){
  const q = (raw||'').toLowerCase().trim();
  if(!q) return "Ask me something like \"today's order summary\" or \"go to settings\".";

  if(/^(hi|hello|hey)\b/.test(q)){
    return "Hi! I can answer questions about orders, blending batches, complaints, revenue, customers, staff, deliveries, recipes, suppliers, ratings, and GMP checklists — and I can navigate the app for you. Try \"today's order summary\" or \"go to settings\".";
  }

  // Navigation commands — "go to settings", "open recipes", "show me the blending board", etc.
  if(qHas(q,'go to','open ','navigate to','take me to','show me')){
    const pageId = findAiNavPage(q);
    if(pageId){
      if(!pageAllowed(pageId)) return `You don't have access to ${PAGE_META[pageId].title} with this account.`;
      goTo(pageId);
      return `Opening ${PAGE_META[pageId].title}…`;
    }
  }

  // Direct order-number lookup, e.g. "SO2609128" or "where is ACIN261596" — checked first
  // since it's more specific than the general "order" keyword matches below.
  const orderMatch = state.orders.find(o => o.orderNumber && q.includes(o.orderNumber.toLowerCase()));
  if(orderMatch){
    const stageName = STAGES[orderMatch.stage];
    const outcome = orderMatch.deliveryOutcome ? ` Marked as ${orderMatch.deliveryOutcome}.` : '';
    const rating = orderMatch.customerRating ? ` Customer rated it ${orderMatch.customerRating}/5.` : '';
    return `Order ${orderMatch.orderNumber} — ${orderMatch.customer} — is at "${stageName}".${outcome}${rating}`;
  }

  if(qHas(q,'picked up today','delivered today')){
    const today = activeOrders().filter(o=>o.stage===STAGES.length-1 && isToday(o.completedAt));
    return `${today.length} order${today.length===1?'':'s'} picked up by delivery today.`;
  }

  if(q.includes('order') && qHas(q,'today','summary')){
    const todays = state.orders.filter(o=>isToday(o.createdAt));
    if(todays.length===0) return "No orders were placed today yet.";
    const lines = STAGES.map((s,i)=>({s, n: todays.filter(o=>o.stage===i).length})).filter(x=>x.n>0).map(x=>`${x.s}: ${x.n}`).join(', ');
    return `Today's orders: ${todays.length} total. ${lines}.`;
  }

  if(q.includes('order') && q.includes('pending')){
    const active = activeOrders();
    const pending = active.filter(o=>o.stage < STAGES.length-1);
    return `${pending.length} pending order${pending.length===1?'':'s'} out of ${active.length} active order${active.length===1?'':'s'}.`;
  }

  if(qHas(q,'priority','high priority','urgent')){
    const active = activeOrders();
    const high = active.filter(o=>o.priority==='High').length;
    return `${high} high-priority order${high===1?'':'s'} out of ${active.length} active.`;
  }

  if(qHas(q,'returned','delivery outcome')){
    const delivered = state.orders.filter(o=>o.deliveryOutcome==='Delivered').length;
    const returned = state.orders.filter(o=>o.deliveryOutcome==='Returned').length;
    return `${delivered} order${delivered===1?'':'s'} marked Delivered, ${returned} marked Returned.`;
  }

  if(q.includes('order')){
    const active = activeOrders();
    const lines = STAGES.map((s,i)=>`${s}: ${active.filter(o=>o.stage===i).length}`).join(', ');
    return `${active.length} active order${active.length===1?'':'s'} right now. ${lines}.`;
  }

  if(qHas(q,'blend','batch')){
    const active = (state.blendBatches||[]).filter(b=>b.stage < BLEND_STAGES.length-1);
    if(active.length===0) return "No blending batches are in progress right now.";
    const names = active.map(b=>`${[b.product,b.qty].filter(Boolean).join(' ')||'Batch'} (${b.batchNo||'no batch #'}) — ${BLEND_STAGES[b.stage]}`).join('; ');
    return `${active.length} batch${active.length===1?'':'es'} in progress: ${names}.`;
  }

  if(q.includes('complaint')){
    const open = state.complaints.filter(c=>c.status==='Open'||c.status==='In Progress');
    if(open.length===0) return "No open complaints right now — all clear!";
    const list = open.map(c=>`${c.customer} (${c.category||'no reason set'}, ${c.status})`).join('; ');
    return `${open.length} open complaint${open.length===1?'':'s'}: ${list}.`;
  }

  if(q.includes('revenue')){
    const revenue = activeOrders().reduce((sum,o)=>sum + (Number(o.value)||0), 0);
    return `Total revenue from active orders: $${revenue.toFixed(2)}.`;
  }

  if(qHas(q,'rating','review','feedback')){
    const rated = state.orders.filter(o=>o.customerRating);
    if(rated.length===0) return "No customer ratings yet.";
    const avg = (rated.reduce((s,o)=>s+o.customerRating,0)/rated.length).toFixed(1);
    const low = rated.filter(o=>o.customerRating<=3).length;
    return `${rated.length} rating${rated.length===1?'':'s'} so far, average ${avg}/5. ${low} rating${low===1?'':'s'} were 3 stars or below.`;
  }

  if(qHas(q,'recipe','formula')){
    if(!state.recipes || state.recipes.length===0) return "No recipes saved yet.";
    return `${state.recipes.length} recipe${state.recipes.length===1?'':'s'} saved: ${state.recipes.map(r=>r.name).join(', ')}.`;
  }

  if(qHas(q,'supplier','vendor')){
    if(state.suppliers.length===0) return "No suppliers added yet.";
    const active = state.suppliers.filter(s=>s.status==='Active'||!s.status).length;
    return `${state.suppliers.length} supplier${state.suppliers.length===1?'':'s'} on file (${active} active).`;
  }

  if(qHas(q,'gmp','checklist','cleaning')){
    const count = (state.gmpChecklistEntries||[]).length;
    return count>0 ? `${count} GMP checklist ${count===1?'entry has':'entries have'} been filled in so far.` : "No GMP checklist entries filled in yet.";
  }

  if(q.includes('customer')){
    return `You have ${state.customers.length} registered customer${state.customers.length===1?'':'s'}.`;
  }

  if(qHas(q,'staff','who is working','who works')){
    if(state.staff.length===0) return "No staff members are set up yet.";
    return `Staff: ${state.staff.map(s=>s.name).join(', ')}.`;
  }

  if(qHas(q,'delivery','courier')){
    const active = activeOrders();
    const lines = (state.deliveryLines||[]).map(l=>`${l.label}: ${active.filter(o=>o.courierService===l.key).length}`).join(', ');
    return lines ? `Orders by delivery line — ${lines}.` : "No delivery lines are set up yet.";
  }

  return "I'm not sure about that yet — try asking about orders, blending batches, complaints, revenue, customers, staff, deliveries, recipes, suppliers, ratings, GMP checklists, or say \"go to <page>\" to navigate there.";
}

/* ===================== Render root ===================== */
// render() tears the whole page down and rebuilds it from `state` on every call — including
// when a realtime update from someone ELSE's login comes in while you're mid-typing into a
// field that hasn't been saved yet (a new customer's name, a chat draft, a search box...).
// That field isn't in `state` at all yet, so the rebuild would silently wipe out whatever
// you'd typed and drop your cursor focus. Capture it beforehand and put it straight back
// afterward so a background update from another session never costs you unsaved typing.
function captureFocusedInput(){
  const el = document.activeElement;
  if(!el) return null;
  // Rich-text fields (Product / task) are a contenteditable div, not a real form control — they
  // don't have a .value the usual snapshot below can capture, so a background rebuild while
  // typing into one silently wiped out everything typed so far. Handle them separately.
  if(el.isContentEditable && el.dataset && el.dataset.richtextInput){
    const form = el.closest('form');
    const selector = (form && form.id ? '#'+CSS.escape(form.id)+' ' : '') + '[data-richtext-input="'+CSS.escape(el.dataset.richtextInput)+'"]';
    return {selector, isRichText:true, value: el.innerHTML};
  }
  const tag = el.tagName;
  if(tag!=='INPUT' && tag!=='TEXTAREA' && tag!=='SELECT') return null;
  // Most form fields in this app are identified by a `name` (read via FormData at submit time)
  // rather than an `id` — scope by the enclosing form's id too so the same field name reused
  // across different forms/modals doesn't get cross-matched.
  let selector = null;
  if(el.id){
    selector = '#'+CSS.escape(el.id);
  } else if(el.name){
    const form = el.closest('form');
    selector = (form && form.id ? '#'+CSS.escape(form.id)+' ' : '') + '[name="'+CSS.escape(el.name)+'"]';
  }
  if(!selector) return null;
  const snapshot = {selector, value: el.value};
  if(typeof el.selectionStart==='number'){
    snapshot.selectionStart = el.selectionStart;
    snapshot.selectionEnd = el.selectionEnd;
  }
  return snapshot;
}
function restoreFocusedInput(snapshot){
  if(!snapshot) return;
  let el;
  try{ el = document.querySelector(snapshot.selector); }catch(e){ return; }
  if(!el) return;
  if(snapshot.isRichText){
    el.innerHTML = snapshot.value;
    placeCaretAtEnd(el);
    return;
  }
  const tag = el.tagName;
  if(tag!=='INPUT' && tag!=='TEXTAREA' && tag!=='SELECT') return;
  el.value = snapshot.value;
  el.focus();
  if(typeof snapshot.selectionStart==='number' && typeof el.setSelectionRange==='function'){
    try{ el.setSelectionRange(snapshot.selectionStart, snapshot.selectionEnd); }catch(e){}
  }
}
// Rich-text cursor position isn't captured/restored precisely (unlike the character-offset
// restore above for plain inputs) — landing at the end of whatever was typed is a reasonable
// place to resume, and far better than losing focus (or the text) entirely.
function placeCaretAtEnd(el){
  el.focus();
  if(typeof window.getSelection==='undefined' || typeof document.createRange==='undefined') return;
  const range = document.createRange();
  range.selectNodeContents(el);
  range.collapse(false);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}
// captureFocusedInput only protects the ONE field you're actively typing in — fine for a lone
// search box, but an open form (new order, edit customer, …) usually has several fields already
// filled in before you tab away from them. A background update landing while you're on, say,
// field 4 would rebuild the form from scratch and silently reset fields 1-3 back to blank even
// though captureFocusedInput faithfully restored field 4 — "my other typed text disappeared" even
// though nothing looked wrong with the field you were actually looking at. This snapshots every
// field inside the open modal/drawer, not just the focused one, so the whole in-progress form
// survives a background re-render, not only its current cursor position.
function captureOpenFormFields(container){
  if(!container) return null;
  const snapshots = [];
  container.querySelectorAll('input, textarea, select, [data-richtext-input]').forEach(el=>{
    const focused = el===document.activeElement;
    if(el.isContentEditable && el.dataset && el.dataset.richtextInput){
      const form = el.closest('form');
      const selector = (form && form.id ? '#'+CSS.escape(form.id)+' ' : '') + '[data-richtext-input="'+CSS.escape(el.dataset.richtextInput)+'"]';
      snapshots.push({selector, isRichText:true, value: el.innerHTML, focused});
      return;
    }
    const tag = el.tagName;
    if(tag!=='INPUT' && tag!=='TEXTAREA' && tag!=='SELECT') return;
    if(tag==='INPUT' && (el.type==='checkbox' || el.type==='radio')) return; // .value isn't their checked state; rare in these forms and not worth the extra bookkeeping
    let selector = null;
    if(el.id){ selector = '#'+CSS.escape(el.id); }
    else if(el.name){
      const form = el.closest('form');
      selector = (form && form.id ? '#'+CSS.escape(form.id)+' ' : '') + '[name="'+CSS.escape(el.name)+'"]';
    }
    if(!selector) return;
    const snap = {selector, value: el.value, focused};
    if(focused && typeof el.selectionStart==='number'){ snap.selectionStart = el.selectionStart; snap.selectionEnd = el.selectionEnd; }
    snapshots.push(snap);
  });
  return snapshots.length ? snapshots : null;
}
function restoreOpenFormFields(snapshots){
  if(!snapshots) return;
  snapshots.forEach(snap=>{
    let el;
    try{ el = document.querySelector(snap.selector); }catch(e){ return; }
    if(!el) return;
    if(snap.isRichText){
      el.innerHTML = snap.value;
      if(snap.focused) placeCaretAtEnd(el);
      return;
    }
    const tag = el.tagName;
    if(tag!=='INPUT' && tag!=='TEXTAREA' && tag!=='SELECT') return;
    el.value = snap.value;
    if(snap.focused){
      el.focus();
      if(typeof snap.selectionStart==='number' && typeof el.setSelectionRange==='function'){
        try{ el.setSelectionRange(snap.selectionStart, snap.selectionEnd); }catch(e){}
      }
    }
  });
}
// Tracks which page last had its entrance animation played, so cards/stat boxes only
// fade+slide in on an actual navigation — not on every re-render a keystroke or realtime
// update triggers while staying on the same page.
let _lastEnterPage = null;
// Same idea for the order/blend/etc. drawer and the admin broadcast panel: state.modal stays the
// same string (e.g. 'order:XYZ') across every re-render that happens WHILE it's open — typing in
// a field, changing a dropdown, a background save, a realtime update, all call render() — so
// without this, the modal's pop-in animation replayed on every single one of those, looking like
// the panel kept popping up again ("double show") every time something was edited or saved.
let _lastOpenModal = null;
let _lastAdminBroadcastId = null;
function render(){
  const openForm = document.querySelector('.modal, .drawer');
  if(openForm){
    const formSnapshot = captureOpenFormFields(openForm);
    renderInner();
    restoreOpenFormFields(formSnapshot);
  } else {
    const focusSnapshot = captureFocusedInput();
    renderInner();
    restoreFocusedInput(focusSnapshot);
  }
}
// Renders normally, unless the user currently has a text field focused inside an open modal or
// drawer (e.g. typing in the order edit form) — a background update (a teammate moving a
// different order, elsewhere, on a shared workspace) shouldn't tear down and rebuild the whole
// shell mid-keystroke. That full rebuild is cheap on a fast machine but showed up as real typing
// lag on slower ones, especially with several people active at once. The state itself is still
// updated immediately by the caller; only the DOM rebuild is pushed a moment out, and coalesces
// into a single render if several background updates land in quick succession.
let _deferredRenderTimer = null;
function renderOrDefer(){
  const active = document.activeElement;
  const typing = active && (active.tagName==='INPUT' || active.tagName==='TEXTAREA' || active.isContentEditable) && active.closest('.modal, .drawer');
  if(!typing){ render(); return; }
  clearTimeout(_deferredRenderTimer);
  _deferredRenderTimer = setTimeout(render, 250);
}
function renderInner(){
  const app = document.getElementById('app');
  if(!state.loaded){ app.innerHTML = `<div class="center-screen"><div class="hint">Loading Audrey Care operations…</div></div>`; return; }
  if(state.backendMissing){ app.innerHTML = renderBackendSetupScreen(); return; }
  if(state.boardMode){ app.innerHTML = renderBoardPage(); attachBoardHandlers(); return; }
  if(state.trackMode){ app.innerHTML = renderTrackPage(); attachTrackHandlers(); return; }
  if(state.complaintMode){ app.innerHTML = renderComplaintPublicPage(); attachComplaintPublicHandlers(); return; }
  if(!state.session){ _lastEnterPage = null; app.innerHTML = renderLogin(); attachLoginHandlers(); return; }
  if(state._showWelcome){ app.innerHTML = renderWelcomeScreen(state._showWelcome); return; }
  if(!pageAllowed(state.page)){ state.page = (pagesForRole(state.session.role)||['dashboard'])[0] || 'dashboard'; }
  // While the crop/resize modal is open, ignore background re-render triggers (realtime updates,
  // chat polling, toast timers, etc.) so they don't tear down the crop canvas mid-interaction.
  if(state.modal==='brandcrop' && document.getElementById('crop-frame')) return;
  const freshPage = state.page !== _lastEnterPage;
  _lastEnterPage = state.page;
  app.innerHTML = renderShell(freshPage);
  attachShellHandlers();
}

function enterTrackMode(e){ if(e) e.preventDefault(); history.replaceState(null,'','#track'); state.trackMode = true; render(); }

  state.trackQuery = raw;
  if(!raw){ state.trackError = 'Enter your order number or phone number.'; state.trackedOrderId = null; render(); return; }
  const norm = raw.toLowerCase().replace(/\s+/g,'');
  const digits = raw.replace(/\D/g,'');
  const match = state.orders.find(o=>{
    const idMatch = (o.id||'').toLowerCase()===norm || (o.orderNumber||'').toLowerCase()===norm;
    const phoneMatch = digits.length>=6 && (o.phone||'').replace(/\D/g,'').endsWith(digits);
    return idMatch || phoneMatch;
  });
  if(match){ state.trackedOrderId = match.id; state.trackError=''; }
  else { state.trackedOrderId = null; state.trackError = "We couldn't find an order with that — double check and try again."; }
  render();
}

function attachTrackHandlers(){
  const el = id=>document.getElementById(id);
  if(el('form-track')) el('form-track').addEventListener('submit', submitTrack);
  const o = state.trackedOrderId ? byId(state.orders, state.trackedOrderId) : null;
  if(o && o.courierService==='CityPak' && o.courierNumber && o.stage>=3 && CITYPAK_CONFIGURED){
    ensureCitypakTracking(o.courierNumber);
  }
  document.querySelectorAll('.rate-stars').forEach(wrap=>{
    const stars = [...wrap.querySelectorAll('.rate-star')];
    stars.forEach((star, idx)=>{
      star.addEventListener('mouseenter', ()=>{ stars.forEach((s,i)=>{ s.textContent = i<=idx ? '★' : '☆'; }); });
      star.addEventListener('click', ()=>{
        state._ratingFeedbackDraft = {orderId: wrap.dataset.orderId, value: idx+1};
        render();
      });
    });
    wrap.addEventListener('mouseleave', ()=>{ stars.forEach(s=>{ s.textContent='☆'; }); });
  });
  if(el('form-rating-feedback')) el('form-rating-feedback').addEventListener('submit', e=>{
    e.preventDefault();
    const draft = state._ratingFeedbackDraft;
    if(!draft) return;
    const feedback = e.target.feedback ? (e.target.feedback.value||'').trim() : '';
    state._ratingFeedbackDraft = null;
    submitCustomerRating(draft.orderId, draft.value, feedback);

}

// Applies the admin-saved drag order (state.navOrder[group] = [itemId,...]) to a group's items,
// falling back to NAV's built-in order for anything not yet customized.
function orderedNavItems(group, items){
  const saved = (state.navOrder && state.navOrder[group]) || [];
  if(!saved.length) return items;
  const byId = {}; items.forEach(it=>{ byId[it.id]=it; });
  const ordered = saved.map(id=>byId[id]).filter(Boolean);
  const missing = items.filter(it=>!saved.includes(it.id));
  return [...ordered, ...missing];
}
function navLabel(item){ return (state.navLabels && state.navLabels[item.id]) || item.label; }
function findNavItemById(id){
  for(const g of NAV){
    const it = g.items.find(x=>x.id===id); if(it) return it;
    for(const parent of g.items){ if(parent.children){ const child = parent.children.find(x=>x.id===id); if(child) return child; } }
  }
  return null;
}
async function renameNavItem(id){
  const item = findNavItemById(id); if(!item) return;
  const name = prompt('Rename this sidebar item:', navLabel(item));
  if(name==null) return;
  const trimmed = name.trim();
  if(!state.navLabels) state.navLabels = {};
  if(!trimmed || trimmed===item.label) delete state.navLabels[id];
  else state.navLabels[id] = trimmed;
  await save('navLabels');
  render();
}
function navGroupsFor(allowedIds){
  return NAV
    .map(g => ({ ...g, items: orderedNavItems(g.group, g.items.filter(it => {
        const ownAllowed = allowedIds.includes(it.id);
        const hasAllowedChild = it.children && it.children.some(c=>allowedIds.includes(c.id));
        return ownAllowed || hasAllowedChild;
      }))
      .map(it => it.children ? {...it, children: it.children.filter(c=>allowedIds.includes(c.id))} : it) }))
    .filter(g => g.items.length > 0);
}
// Finds the row a dragged sidebar-order item should be inserted before, based on cursor Y position.
function cardDragAfterElement(container, y){
  const els = [...container.querySelectorAll('.card:not(.dragging)')];
  return els.reduce((closest, child)=>{
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height/2;
    if(offset < 0 && offset > closest.offset) return { offset, element: child };
    return closest;
  }, { offset: -Infinity, element: null }).element;
}
function navDragAfterElement(container, y){
  const els = [...container.querySelectorAll('.nav-order-row:not(.dragging):not(.nav-order-child)')];
  return els.reduce((closest, child)=>{
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height/2;
    if(offset < 0 && offset > closest.offset) return { offset, element: child };
    return closest;
  }, { offset: -Infinity, element: null }).element;
}

/* ===================== Order inquiry (delivered orders, read-only) ===================== */
// Orders land here once they've auto-archived — 2 hours after being picked up by delivery
// (see ORDER_ARCHIVE_AFTER_MS / archivedOrders()). Names only; click a row for the full,
// view-only details, or use the review buttons to text the customer a review link.
const ORDER_INQUIRY_PAGE_SIZE = 60;
function renderOrderInquiryPage(){
  const q = (state.filters.orderInquirySearch||'').toLowerCase();
  // With years of history, archivedOrders() can hold thousands of rows — rendering all of them
  // unconditionally made this page (and scrolling on it) very slow on weaker machines. A search
  // shows every match (search results are naturally small); otherwise show only the most recent
  // page, with a button to reveal more.
  const matches = archivedOrders().filter(o=>{
    if(!q) return true;
    return (o.customer||'').toLowerCase().includes(q)
      || (o.orderNumber||o.id||'').toLowerCase().includes(q)
      || (o.phone||'').includes(q);
  });
  const limit = q ? matches.length : (state.filters.orderInquiryLimit || ORDER_INQUIRY_PAGE_SIZE);
  const rows = matches.slice(0, limit);
  const hiddenCount = matches.length - rows.length;
  return `
  <div class="toolbar">
    <input class="search-input" id="order-inquiry-search" placeholder="Search by customer name…" value="${esc(state.filters.orderInquirySearch||'')}">
  </div>
  ${rows.length===0 ? `<div class="empty-state">${q?'No matching orders.':'Nothing here yet — orders show up 2 hours after being picked up by delivery.'}</div>` : `
  <div class="panel">
    ${rows.map(o=>{
      const admin = isAdmin();
      const fbSent = !!o.reviewSentFbAt, googleSent = !!o.reviewSentGoogleAt;
      const fbLocked = fbSent && !admin, googleLocked = googleSent && !admin;
      const onHold = o.deliveryOutcome==='On Hold';
      const delivered = o.deliveryOutcome==='Delivered';
      const deliveredLocked = delivered && !admin;
      return `
      <div class="list-row oi-row" data-order-row="${o.id}" style="cursor:pointer;justify-content:space-between;">
        <span style="display:flex;align-items:center;gap:10px;">
          <span class="lr-avatar empty">${initials(o.customer||'?')}</span>
          <span class="lr-name">${esc(o.customer)}</span>
        </span>
        <span class="oi-row-actions" style="display:grid;grid-template-columns:140px 132px 172px 172px;gap:8px;align-items:center;">
          <button type="button" class="btn btn-sm" style="width:100%;" data-view-tracking="${o.id}" onclick="event.stopPropagation()">👁 View tracking</button>
          ${o.deliveryOutcome
            ? `<span class="pill ${delivered?'pill-active':(onHold?'pill-hold':'pill-high')}" style="width:100%;box-sizing:border-box;text-align:center;cursor:${deliveredLocked?'default':'pointer'};" ${deliveredLocked?'':`data-open-delivery-outcome="${o.id}"`} onclick="event.stopPropagation()" ${deliveredLocked?'title="Delivered — only Admin can change this."':'title="Click to change"'}>${esc(o.deliveryOutcome)}</span>`
            : `<button type="button" class="btn btn-sm" style="width:100%;" data-open-delivery-outcome="${o.id}" onclick="event.stopPropagation()">Delivery status</button>`}
          <button type="button" class="btn btn-sm" style="width:100%;" data-review-fb="${o.id}" ${fbLocked?'disabled title="Already sent — only Admin can send it again."':''} onclick="event.stopPropagation()">${fbSent?'FB review sent ✓':'Send FB review link'}</button>
          <button type="button" class="btn btn-sm" style="width:100%;" data-review-google="${o.id}" ${googleLocked?'disabled title="Already sent — only Admin can send it again."':''} onclick="event.stopPropagation()">${googleSent?'Google review sent ✓':'Send Google review'}</button>
        </span>
      </div>`;
    }).join('')}
  </div>
  ${hiddenCount>0 ? `<div style="text-align:center;margin-top:14px;"><button type="button" class="btn" id="btn-order-inquiry-more">Show older orders (${hiddenCount} more)</button></div>` : ''}`}
  `;
}

/* ===================== Blending board page ===================== */
function renderBlendingBoardPage(){
  return `
  <div class="toolbar">
    ${canManageBlendBoard() ? `<button class="btn btn-primary" id="btn-new-blend" style="margin-left:auto;">+ New batch</button>` : ''}
  </div>
  ${state.blendBatches.length===0 ? `
    <div class="empty-state">
      <p style="font-size:15px;margin-bottom:14px;">No batches on the board yet.</p>
      ${canManageBlendBoard() ? `<button class="btn btn-primary" id="btn-new-blend-2">+ Add the first batch</button>` : ''}
    </div>
  ` : `
  <div class="board">
    ${BLEND_STAGES.map((stageName,i)=>renderBlendColumn(stageName,i)).join('')}
  </div>`}
  `;
}
function renderBlendColumn(stageName, i){
  const key = BLEND_STAGE_KEYS[i]; const style = BLEND_STAGE_STYLE[key];
  const batches = state.blendBatches.filter(b=>b.stage===i).sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
  return `
  <div class="column">
    <div class="column-head" style="background:${style.bg};color:${style.c};">
      <span class="name">${stageName}</span><span class="count">${batches.length}</span>
    </div>
    <div class="column-body" data-blend-stage="${i}">
      ${batches.length===0 ? `<div class="empty-col">Nothing here</div>` : batches.map(b=>renderBlendCard(b)).join('')}
    </div>
  </div>`;
}
function renderBlendCard(b){
  const priority = b.priority || 'Medium';
  return `
  <div class="card" draggable="${canManageBlendBoard()?'true':'false'}" data-blend="${b.id}">
    <div class="top-row"><span class="customer">${esc(b.batchNo)}</span><span class="order-id">${b.id}</span></div>
    <div class="product">${esc(b.product)} ${b.qty?('· qty '+esc(b.qty)):''}</div>
    <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;">
      <span class="pill pill-${priority.toLowerCase()}">${priority}</span>
    </div>
    <div class="meta-row">
      <span class="assignee ${b.assignee?'':'unassigned'}"><span class="dot"></span>${b.assignee ? esc(b.assignee) : 'Unassigned'}</span>
      <span class="days">${daysAgo(b.createdAt)}</span>
    </div>
  </div>`;
}
